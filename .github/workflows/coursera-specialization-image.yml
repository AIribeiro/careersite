name: Coursera Specialization Image

on:
  push:
    paths:
      - ".github/workflows/coursera-specialization-image.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture specialization diploma
        run: |
          set -euo pipefail
          URL='https://www.coursera.org/account/accomplishments/specialization/49J7ASIMWWFA'
          BROWSER=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium)
          echo "BROWSER=$BROWSER"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --window-size=1600,1200 --virtual-time-budget=15000 \
            --screenshot=certificate-page.png "$URL" || true
          file certificate-page.png || true
          python - <<'PY'
          from PIL import Image
          p="certificate-page.png"
          im=Image.open(p)
          print("SIZE", im.size)
          PY
      - name: Upload capture
        uses: actions/upload-artifact@v4
        with:
          name: coursera-specialization-diploma
          path: certificate-page.png
