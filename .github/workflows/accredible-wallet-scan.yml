name: Accredible Wallet Scan

on:
  push:
    paths:
      - ".github/workflows/accredible-wallet-scan.yml"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Render public wallet in Chrome
        run: |
          set -euo pipefail
          URL='https://www.credential.net/profile/jairribeiro188506/wallet'
          BROWSER=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium)
          echo "BROWSER $BROWSER"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=12000 --dump-dom "$URL" > wallet.html
          echo "HTML_BYTES $(wc -c < wallet.html)"
          python - <<'PY'
          import re, html
          text=open("wallet.html",encoding="utf-8",errors="replace").read()
          clean=re.sub(r'<script[\\s\\S]*?</script>|<style[\\s\\S]*?</style>',' ',text,flags=re.I)
          clean=re.sub(r'<[^>]+>','\\n',clean)
          clean=html.unescape(clean)
          lines=[re.sub(r'\\s+',' ',x).strip() for x in clean.splitlines()]
          lines=[x for x in lines if x]
          print("VISIBLE_TEXT")
          for line in lines[:1200]:
              print(line)
          print("CREDENTIAL_LINKS")
          links=sorted(set(re.findall(r'href=["\\x27]([^"\\x27]+)["\\x27]',text,re.I)))
          for link in links:
              if "credential.net/" in link or re.search(r'/[0-9a-f]{8}-[0-9a-f-]{27,}',link,re.I):
                  print(link)
          print("IMAGES")
          imgs=sorted(set(re.findall(r'<img[^>]+src=["\\x27]([^"\\x27]+)',text,re.I)))
          for img in imgs[:200]:
              print(img)
          PY
      - name: Upload wallet snapshot
        uses: actions/upload-artifact@v4
        with:
          name: accredible-wallet
          path: wallet.html
