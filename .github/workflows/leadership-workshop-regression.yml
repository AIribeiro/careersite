name: Executive Leadership Workshop regression

on:
  push:
    paths:
      - "src/page_advisory_leadership_*.py"
      - "src/page_advisory_portal.py"
      - "src/page_advisory_member_experience.py"
      - "src/page_public_services.py"
      - "src/site_reader_navigation.py"
      - "tests/test_leadership_workshop.py"
      - ".github/workflows/leadership-workshop-regression.yml"
  workflow_dispatch:

jobs:
  leadership:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install site dependencies
        run: python -m pip install -r requirements.txt
      - name: Test leadership assessment, report and navigation
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_leadership_workshop.py -v
