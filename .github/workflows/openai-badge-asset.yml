name: OpenAI Badge Asset

on:
  push:
    paths:
      - ".github/workflows/openai-badge-asset.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download issued OpenAI Academy badge
        run: |
          set -euo pipefail
          mkdir -p images/credentials
          curl --fail --location --retry 3 \
            "https://api.accredible.com/v1/frontend/credential_badge_image/855a1e37-b0d2-4e7d-aed6-ae9a839c6de0" \
            -o images/credentials/openai_ai_leadership.png
          file images/credentials/openai_ai_leadership.png
      - name: Commit badge artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/credentials/openai_ai_leadership.png
          git commit -m "Add issued OpenAI Academy AI Leadership badge"
          git push
