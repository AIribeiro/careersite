name: Verify live AI Portfolio Renewal briefing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/renewal-briefing-live-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and PDF tools
        run: |
          python -m pip install --quiet playwright==1.58.0 pypdf==6.5.0 requests
          python -m playwright install chromium
      - name: Verify source-controlled assets and public reader routes
        run: |
          python - <<'PY'
          import hashlib, io, time, requests
          from playwright.sync_api import sync_playwright
          from pypdf import PdfReader
          slug='would-you-fund-the-same-ai-initiatives-today'
          raw='https://raw.githubusercontent.com/AIribeiro/careersite/main/static/briefing-artwork/'+slug+'/'
          manifest=requests.get(raw+'manifest.json',timeout=20)
          assert manifest.status_code==200, 'Published manifest not available: '+str(manifest.status_code)
          b=manifest.json()
          assert b['article_fingerprint']=='b9e255ca0e7ac9fdf7504e98fe07dd9e8f642c96c4e492d6aac4adf511c27bd5'
          for name in ('desktop','mobile','pdf'):
              spec=b[name]
              res=requests.get(raw+spec['file'],timeout=30)
              assert res.status_code==200, (name,res.status_code)
              assert hashlib.sha256(res.content).hexdigest()==spec['sha256'], 'Asset hash mismatch for '+name
              if name=='pdf':
                  doc=PdfReader(io.BytesIO(res.content),strict=True)
                  assert len(doc.pages)==1
                  assert 589<float(doc.pages[0].mediabox.width)<601
              print('LIVE BINARY',name,len(res.content),spec['sha256'],flush=True)
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              base='https://jairribeiro-ai.streamlit.app/'
              route='?page=briefing&article='+slug+'&source=internal_qa&role=smoke'
              page=browser.new_page(viewport={'width':1440,'height':900})
              last=''
              for attempt in range(5):
                  try:
                      page.goto(base+route,wait_until='domcontentloaded',timeout=45000)
                      # Streamlit Cloud serves the app inside a /~/+/ child frame.
                      # Read the actual app frame rather than the empty outer shell.
                      content_frame=None
                      for wait in range(15):
                          for frame in page.frames:
                              if frame.locator('.site .briefing-preview-hero h1').count() > 0:
                                  content_frame=frame
                                  break
                          if content_frame:break
                          time.sleep(2)
                      assert content_frame is not None,'Full page did not mount a Streamlit content frame'
                      heading=content_frame.locator('.site .briefing-preview-hero h1').first.inner_text()
                      assert heading=='Would You Fund the Same AI Initiatives Today?', heading
                      assert content_frame.locator('.site .briefing-unlock-primary').count()>=1, 'Missing free reader unlock'
                      public_body=content_frame.locator('body').inner_text()
                      assert 'Download the fillable A4 decision record' not in public_body, 'Private resource leaked to public'
                      print('LIVE PUBLIC PREVIEW: title, free registration and private-worksheet exclusion verified',flush=True)
                      last=''
                      break
                  except Exception as exc:
                      last=str(exc)[:320]
                      print('Preview check',attempt+1,'failed:',last,flush=True)
                      if attempt<4:time.sleep(10)
              assert not last, last
              # The branded domain is a masked forwarding frame; independently check
              # the visitor reaches this same edition, not the site's default home.
              try:
                  page.goto('https://jairribeiro.com/'+route,wait_until='domcontentloaded',timeout=35000)
                  # A registrar's masked frame may contain another Streamlit
                  # content frame. Inspect all available frames, including nested.
                  matched=False
                  for attempt in range(16):
                      for frame in page.frames:
                          try:
                              titles=frame.locator('.site .briefing-preview-hero h1')
                              if titles.count() and titles.first.inner_text(timeout=4000)=='Would You Fund the Same AI Initiatives Today?':
                                  matched=True
                                  break
                          except Exception:pass
                      if matched:break
                      time.sleep(2)
                  assert matched,'Branded URL did not show new briefing in any nested frame'
                  print('BRANDED PAGE: correct briefing title rendered',flush=True)
              except Exception as exc:
                  print('BRANDED PAGE WARNING:',type(exc).__name__,str(exc)[:300],flush=True)
                  # Do not call a masked-domain check successful based on origin proof alone.
                  raise
              browser.close()
          PY
