name: Validate approved canonical CV

on:
  push:
    branches: [main]
    paths:
      - "src/site_cv.py"
      - "src/career_facts.py"
      - "src/site_assets.py"
      - "requirements.txt"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils

      - name: Validate PDF structure
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from pypdf import PdfReader
          import site_cv

          path = Path("static") / site_cv.CV_FILENAME
          data = path.read_bytes()
          assert data.startswith(b"%PDF-"), "Missing PDF header"
          assert data.rstrip().endswith(b"%%EOF"), "Missing PDF EOF marker"
          reader = PdfReader(BytesIO(data), strict=True)
          assert len(reader.pages) >= 1, "PDF has no pages"
          assert reader.trailer.get("/Root") is not None, "PDF catalog missing"
          uris = set()
          for page in reader.pages:
              for annotation in page.get("/Annots", []):
                  action = annotation.get_object().get("/A")
                  if action is not None and action.get("/URI"):
                      uris.add(str(action["/URI"]))
          for link in (site_cv.CV_SITE_URL, site_cv.CERTIFICATIONS_URL, site_cv.PRESENCE_URL):
              assert link in uris, f"Approved CV missing hyperlink: {link}"
          text = " ".join(page.extract_text() or "" for page in reader.pages).replace("–", "-")
          for period in ("Dec 2025 - Sep 2026", "Jul 2016 - Jul 2017", "Jan 2013 - Jul 2016"):
              assert period in text, f"Approved LinkedIn-aligned career period missing: {period}"
          print(f"Strict parser validated {path}: {len(data)} bytes, {len(reader.pages)} page(s)")
          PY

      - name: Validate with standard PDF tools and renderer
        env:
          PYTHONPATH: src
        run: |
          PDF="static/$(python -c 'import site_cv; print(site_cv.CV_FILENAME)')"
          qpdf --check "$PDF"
          pdfinfo "$PDF"
          mkdir -p /tmp/cv-render
          pdftoppm -f 1 -singlefile -png -r 120 "$PDF" /tmp/cv-render/page >/dev/null
          test -s /tmp/cv-render/page.png
          file /tmp/cv-render/page.png

      - name: Ensure approved CV stays unchanged during checks
        run: git diff --exit-code -- static/Jair_Ribeiro_CV.pdf
