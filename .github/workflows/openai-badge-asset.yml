name: OpenAI Badge Asset

on:
  push:
    paths:
      - ".github/workflows/openai-badge-asset.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve issued OpenAI Academy badge
        run: |
          set -euo pipefail
          K1='9532428a326b32d3b088f47b34479eac'
          K2='60493830b1f3ce502097c2a10e237c2c'
          URL="https://oaiacademy.credential.net/855a1e37-b0d2-4e7d-aed6-ae9a839c6de0?key=${K1}${K2}"
          curl --fail --location --retry 3 -A 'Mozilla/5.0' "$URL" -o credential.html
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          text=open("credential.html",encoding="utf-8",errors="replace").read()
          scripts=re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)',text,re.I)
          print("SCRIPTS")
          for src in scripts:
              print(urljoin("https://oaiacademy.credential.net/",src))
          print("HTML_BYTES",len(text.encode()))
          PY
          while read -r JS; do
            [ -z "$JS" ] && continue
            curl --fail --location --retry 2 -A 'Mozilla/5.0' "$JS" -o bundle.js || continue
            grep -Eo '.{0,100}(credential|badge|recipient|verification|public).{0,180}' bundle.js | head -n 40 || true
          done < <(python - <<'PY'
          import re
          from urllib.parse import urljoin
          text=open("credential.html",encoding="utf-8",errors="replace").read()
          for src in re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)',text,re.I):
              print(urljoin("https://oaiacademy.credential.net/",src))
          PY
          )
