name: Premium Briefing artwork contract

on:
  push:
    branches: [main]
    paths:
      - 'src/briefing_approved_asset_renderer.py'
      - 'src/briefing_infographic_store.py'
      - 'src/site_cms.py'
      - 'src/page_admin.py'
      - 'app.py'
      - 'scripts/build_briefing_artwork_bundle.py'
      - 'static/briefing-artwork/**'
      - 'tests/test_briefing_approved_asset_renderer.py'
      - 'tests/test_governance_briefing_v2_release.py'
      - '.github/workflows/briefing-premium-artwork-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/briefing_approved_asset_renderer.py'
      - 'src/briefing_infographic_store.py'
      - 'src/site_cms.py'
      - 'src/page_admin.py'
      - 'app.py'
      - 'scripts/build_briefing_artwork_bundle.py'
      - 'static/briefing-artwork/**'
      - 'tests/test_briefing_approved_asset_renderer.py'
      - 'tests/test_governance_briefing_v2_release.py'
      - '.github/workflows/briefing-premium-artwork-ci.yml'

permissions:
  contents: read

jobs:
  verify-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile premium bundle, renderer and admin gates
        run: python -m py_compile src/briefing_approved_asset_renderer.py src/briefing_infographic_store.py src/site_cms.py src/page_admin.py scripts/build_briefing_artwork_bundle.py app.py tests/test_briefing_approved_asset_renderer.py tests/test_governance_briefing_v2_release.py
      - name: Verify packaging, exact source and Safari self-contained images
        run: python -m unittest -v tests.test_briefing_approved_asset_renderer tests.test_governance_briefing_v2_release
      - name: Verify direct public PDF URL returns the exact approved binary
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/AIribeiro/careersite/${GITHUB_SHA}/static/briefing-artwork/15-ways-ai-can-change-your-business/infographic.pdf"
          curl --fail --location --retry 3 --max-time 45 --silent --show-error -o /tmp/approved-infographic.pdf "$URL"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          from pypdf import PdfReader
          asset=Path("/tmp/approved-infographic.pdf").read_bytes()
          manifest=json.loads(Path("static/briefing-artwork/15-ways-ai-can-change-your-business/manifest.json").read_text())
          assert asset[:5]==b"%PDF-", "Direct public URL returned a non-PDF response"
          assert hashlib.sha256(asset).hexdigest()==manifest["pdf"]["sha256"], "Downloaded PDF differs from published manifest"
          reader=PdfReader("/tmp/approved-infographic.pdf",strict=True)
          assert len(reader.pages)==manifest["pdf"]["pages"]
          print("Public URL returned exact approved A4 PDF bytes:",len(asset))
          PY
      - name: Check no broken image endpoints are emitted
        run: |
          python - <<'PY'
          from pathlib import Path
          reader=Path('src/briefing_approved_asset_renderer.py').read_text()
          assert 'data:image/webp;base64,' in reader
          assert 'canonical-infographic-download' in reader
          assert 'briefing-infographic' in reader
          assert 'article_fingerprint' in reader
          assert 'verified_pdf_for_article' in reader
          print('New briefing release contract is self-contained and source gated.')
          PY
