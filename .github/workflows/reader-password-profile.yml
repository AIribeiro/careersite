name: Reader password and professional profile
on:
  push:
    branches:
      - feature/reader-password-profile-20261112
  pull_request:
    paths:
      - src/page_reader_native.py
      - src/page_owner_reader_management.py
      - src/site_reader_shell.py
      - tests/reader_password_profile_smoke_app.py
      - tests/test_reader_password_profile.py
      - .github/workflows/reader-password-profile.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate syntax
        run: |
          python -m compileall -q src/page_reader_native.py src/page_owner_reader_management.py src/site_reader_shell.py tests/test_reader_password_profile.py tests/reader_password_profile_smoke_app.py
      - name: Password and profile regressions
        run: |
          python -m unittest discover -s tests -p test_reader_password_profile.py -v
          python -m unittest discover -s tests -p test_reader_membership.py -v
          python -m unittest discover -s tests -p test_reader_library_membership.py -v
