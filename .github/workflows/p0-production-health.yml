name: P0 production reachability check
on:
  push:
    paths:
      - ".github/workflows/p0-production-health.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Diagnose production redirects and response status
        shell: bash
        run: |
          set -u
          SITE="https://jairribeiro-ai.streamlit.app"
          for path in / /_stcore/health /robots.txt; do
            echo "Checking $SITE$path"
            status="$(curl -sS --connect-timeout 8 --max-time 14 -D /tmp/p0headers -o /tmp/p0body -w '%{http_code}' "$SITE$path" || true)"
            echo "HTTP ${status:-unavailable}"
            python - <<'PY'
          from urllib.parse import urlsplit
          from pathlib import Path
          headers=Path("/tmp/p0headers").read_text(errors="replace") if Path("/tmp/p0headers").exists() else ""
          for line in headers.splitlines():
              if line.lower().startswith("location:"):
                  dest=line.split(":",1)[1].strip()
                  target=urlsplit(dest)
                  print(f"Redirect target (query redacted): {target.scheme}://{target.netloc}{target.path}")
              elif line.lower().startswith("content-type:"):
                  print(line.strip())
          PY
            if [ "$path" = "/_stcore/health" ] && [ "$status" = "200" ]; then
              echo "HEALTHY"
              exit 0
            fi
          done
          echo "::error::Production is not healthy; inspect Cloud deployment manager and access settings."
          exit 1
