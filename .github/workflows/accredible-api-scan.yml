name: Accredible API Scan

on:
  push:
    paths:
      - ".github/workflows/accredible-api-scan.yml"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect recipient portal API routes
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://oaiacademy.credential.net/main.942b279e08dbf798.js" \
            -o main.js
          python - <<'PY'
          import re
          text=open("main.js",encoding="utf-8",errors="replace").read()
          needles=[
              "credential_badge_image",
              "credential_seo_image",
              "recipient_portal",
              "recipient-portal",
              "credential_key",
              "public_credential",
              "/credentials/",
              "/credential/",
              "api.accredible",
              "/frontend/",
          ]
          for needle in needles:
              print("\n###",needle)
              pos=0
              count=0
              while True:
                  i=text.find(needle,pos)
                  if i<0 or count>=12: break
                  print(text[max(0,i-220):i+360].replace("\n"," "))
                  pos=i+len(needle)
                  count+=1
          urls=sorted(set(re.findall(r'https?://[^"\x27\\ ]+',text)))
          print("\n### URLs")
          for u in urls:
              if "accredible" in u.lower() or "credential" in u.lower():
                  print(u[:500])
          PY
