name: Release nine-gap AI governance briefing artwork
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_ai_governance_blind_spots.py.xz.b64'
      - '.github/workflows/ai-governance-blind-spots-artwork.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-reviewed-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Decode and source-hash verify the authored generator
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib
          archive=Path('scripts/generate_ai_governance_blind_spots.py.xz.b64')
          data=lzma.decompress(base64.b64decode(archive.read_text().strip(), validate=True))
          expected='084c0a57bba014db2286ea1c2eb30d737ee101a0914f6d058c012504cd20bb7b'
          digest=hashlib.sha256(data).hexdigest()
          assert digest==expected, f'Generator digest mismatch: {digest}'
          Path('scripts/generate_ai_governance_blind_spots.py').write_bytes(data)
          print('Reviewed generator SHA256:',digest)
          PY
      - name: Install image and PDF tools
        run: python -m pip install -r requirements.txt 'reportlab==4.4.4'
      - name: Generate original desktop/mobile/PDF source
        run: python scripts/generate_ai_governance_blind_spots.py --output /tmp/governance-9
      - name: Package source-matched immutable release
        run: |
          if [ ! -f static/briefing-artwork/ai-governance-blind-spots-nine-controls/manifest.json ]; then
            python scripts/build_briefing_artwork_bundle.py \
              --slug ai-governance-blind-spots-nine-controls \
              --article-fingerprint 9a0b795e0087af514228c31821a8cca315b497e6aed6cc108a0849006f427f00 \
              --revision 2026-11-06-r1 \
              --desktop /tmp/governance-9/desktop.png \
              --mobile /tmp/governance-9/mobile.png \
              --pdf /tmp/governance-9/infographic.pdf \
              --heading "Who is accountable for the AI you cannot see?" \
              --deck "Nine governance blind spots, three operating obligations and one live control record."
          fi
      - name: Validate actual hashes, graphics and common HTML renderer
        run: |
          PYTHONPATH=src python -m unittest -v tests.test_briefing_approved_asset_renderer
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from PIL import Image
          from src.briefing_approved_asset_renderer import load_bundle,validate_bundle
          root=Path('static/briefing-artwork')
          b=load_bundle('ai-governance-blind-spots-nine-controls',asset_root=root)
          assert b and b['article_fingerprint']=='9a0b795e0087af514228c31821a8cca315b497e6aed6cc108a0849006f427f00'
          for name in ('desktop','mobile'):
              f=root/b['slug']/b[name]['file']
              im=Image.open(f);im.verify()
              assert hashlib.sha256(f.read_bytes()).hexdigest()==b[name]['sha256']
          validate_bundle(b)
          print('Desktop, mobile, PDF and manifest verified.')
          PY
      - name: Commit the editable generator and approved-ready source bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate_ai_governance_blind_spots.py static/briefing-artwork/ai-governance-blind-spots-nine-controls/
          if ! git diff --cached --quiet; then
            git commit -m "Build source-locked nine-gap governance infographic and PDF"
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
