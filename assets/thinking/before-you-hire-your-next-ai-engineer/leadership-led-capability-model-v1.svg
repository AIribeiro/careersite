<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc"><title id="title">Two ways to build enterprise AI capability</title><desc id="desc">Four stages compare the risk of capacity-first investment with leadership-led discovery, staffing and delivery. Technical discovery and leadership can proceed in parallel.</desc><rect width="1440" height="1120" fill="#F7F4EE"/><rect width="1440" height="244" fill="#10283B"/><rect x="64" y="43" width="40" height="4" fill="#D5A57C"/><text x="119" y="50" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#E1B892" font-weight="700" letter-spacing="2.2">JAIR RIBEIRO  /  THINKING</text><text x="64" y="118" font-family="Arial, Helvetica, sans-serif" font-size="48" fill="#FFFFFF" font-weight="700" >Two ways to build</text><text x="64" y="176" font-family="Arial, Helvetica, sans-serif" font-size="48" fill="#FFFFFF" font-weight="700" >enterprise AI capability</text><text x="64" y="215" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#D2DEE5" font-weight="400" >How investment sequencing shapes the mandate for technical teams</text><rect x="64" y="274" width="648" height="99" rx="8" fill="#9B5038"/><text x="90" y="312" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FFFFFF" font-weight="700" letter-spacing="1.2">CAPACITY-FIRST</text><text x="90" y="345" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="400" >Technical capacity precedes a clear mandate</text><rect x="64" y="394" width="648" height="108" rx="8" fill="#F5EAE2" stroke="#9B5038" stroke-opacity=".27"/><circle cx="103" cy="431" r="20" fill="#9B5038"/><text x="103" y="438" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="136" y="436" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#163247" font-weight="700" >Recruit technical specialists</text><text x="136" y="470" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#344B59" font-weight="400" >Budget is committed before priorities are clear.</text><path d="M388 502 v18 m-6 -6 l6 6 6 -6" stroke="#9B5038" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="525" width="648" height="108" rx="8" fill="#F5EAE2" stroke="#9B5038" stroke-opacity=".27"/><circle cx="103" cy="562" r="20" fill="#9B5038"/><text x="103" y="569" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="136" y="567" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#163247" font-weight="700" >Build and demonstrate</text><text x="136" y="601" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#344B59" font-weight="400" >Pilots expose dependencies and unanswered questions.</text><path d="M388 633 v18 m-6 -6 l6 6 6 -6" stroke="#9B5038" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="656" width="648" height="108" rx="8" fill="#F5EAE2" stroke="#9B5038" stroke-opacity=".27"/><circle cx="103" cy="693" r="20" fill="#9B5038"/><text x="103" y="700" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="136" y="698" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#163247" font-weight="700" >Resolve business barriers</text><text x="136" y="732" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#344B59" font-weight="400" >Ownership, readiness and adoption need late attention.</text><path d="M388 764 v18 m-6 -6 l6 6 6 -6" stroke="#9B5038" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="787" width="648" height="108" rx="8" fill="#F5EAE2" stroke="#9B5038" stroke-opacity=".27"/><circle cx="103" cy="824" r="20" fill="#9B5038"/><text x="103" y="831" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="136" y="829" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#163247" font-weight="700" >Rework or expand</text><text x="136" y="863" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#344B59" font-weight="400" >More resources may be required before value is proven.</text><rect x="728" y="274" width="648" height="99" rx="8" fill="#2C716D"/><text x="754" y="312" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FFFFFF" font-weight="700" letter-spacing="1.2">LEADERSHIP-LED</text><text x="754" y="345" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#FFFFFF" font-weight="400" >Direction and discovery guide capacity</text><rect x="728" y="394" width="648" height="108" rx="8" fill="#E8F0ED" stroke="#2C716D" stroke-opacity=".27"/><circle cx="767" cy="431" r="20" fill="#2C716D"/><text x="767" y="438" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="800" y="436" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#163247" font-weight="700" >Define outcomes and ownership</text><text x="800" y="470" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#344B59" font-weight="400" >Name the business sponsor and decision authority.</text><path d="M1052 502 v18 m-6 -6 l6 6 6 -6" stroke="#2C716D" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="728" y="525" width="648" height="108" rx="8" fill="#E8F0ED" stroke="#2C716D" stroke-opacity=".27"/><circle cx="767" cy="562" r="20" fill="#2C716D"/><text x="767" y="569" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="800" y="567" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#163247" font-weight="700" >Assess readiness and test assumptions</text><text x="800" y="601" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#344B59" font-weight="400" >Examine workflow, data, controls and technical feasibility.</text><path d="M1052 633 v18 m-6 -6 l6 6 6 -6" stroke="#2C716D" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="728" y="656" width="648" height="108" rx="8" fill="#E8F0ED" stroke="#2C716D" stroke-opacity=".27"/><circle cx="767" cy="693" r="20" fill="#2C716D"/><text x="767" y="700" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="800" y="698" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#163247" font-weight="700" >Design the delivery mandate</text><text x="800" y="732" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#344B59" font-weight="400" >Choose skills, team size and delivery model from evidence.</text><path d="M1052 764 v18 m-6 -6 l6 6 6 -6" stroke="#2C716D" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="728" y="787" width="648" height="108" rx="8" fill="#E8F0ED" stroke="#2C716D" stroke-opacity=".27"/><circle cx="767" cy="824" r="20" fill="#2C716D"/><text x="767" y="831" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="800" y="829" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#163247" font-weight="700" >Deliver, measure and adapt</text><text x="800" y="863" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#344B59" font-weight="400" >Fund further capacity against results and operating needs.</text><rect x="64" y="929" width="1312" height="110" rx="8" fill="#10283B"/><text x="88" y="966" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#E1B892" font-weight="700" letter-spacing="1.5">EXECUTIVE DECISION</text><text x="88" y="1003" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#FFFFFF" font-weight="700" >Before funding more capacity, clarify who owns the outcome and what evidence justifies the investment.</text><text x="64" y="1076" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#465F6C" font-weight="400" >Conceptual comparison, not a rigid sequence. Technical discovery and leadership can proceed in parallel.</text><text x="1376" y="1100" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#465F6C" font-weight="700" text-anchor="end">jairribeiro.com</text></svg>