name: Build and validate canonical CV

on:
  push:
    branches: [main]
    paths:
      - "src/site_cv.py"
      - "src/site_cv_ats.py"
      - "src/career_facts.py"
      - "src/site_assets.py"
      - "requirements.txt"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt python-docx==1.2.0

      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils libreoffice-writer fonts-liberation

      - name: Generate canonical CV from reviewed source
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from pathlib import Path
          from site_cv import CV_FILENAME, build_public_cv
          path = Path('static') / CV_FILENAME
          path.write_bytes(build_public_cv())
          print('Built', path, path.stat().st_size, 'bytes')
          PY

      - name: Validate PDF structure
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from pypdf import PdfReader
          import site_cv

          path = Path("static") / site_cv.CV_FILENAME
          data = path.read_bytes()
          assert data.startswith(b"%PDF-"), "Missing PDF header"
          assert data.rstrip().endswith(b"%%EOF"), "Missing PDF EOF marker"
          reader = PdfReader(BytesIO(data), strict=True)
          assert len(reader.pages) == 2, "Reviewed CV must be exactly two pages"
          assert reader.trailer.get("/Root") is not None, "PDF catalog missing"
          uris = set()
          for page in reader.pages:
              for annotation in page.get("/Annots", []):
                  action = annotation.get_object().get("/A")
                  if action is not None and action.get("/URI"):
                      uris.add(str(action["/URI"]))
          expected = (site_cv.CV_SITE_URL, site_cv.CERTIFICATIONS_URL, site_cv.PRESENCE_URL)
          for link in expected:
              assert link in uris, f"Approved CV missing hyperlink: {link}"
              assert link.startswith("https://jairribeiro.com/"), link
          assert not any("streamlit.app" in link.lower() for link in uris), "Legacy Streamlit link found in CV"
          text = " ".join(page.extract_text() or "" for page in reader.pages).replace("–", "-")
          for period in ("Dec 2025 - Sep 2026", "Aug 2022 - Dec 2025", "Jul 2021 - Sep 2022", "Jun 2018 - Jul 2021", "Jul 2016 - Jul 2017", "Jan 2013 - Jul 2016"):
              assert period in text, f"Approved LinkedIn-aligned career period missing: {period}"
          assert "Wroclaw, Poland" in (reader.pages[0].extract_text() or ""), "Wroclaw Volvo role not on page one"
          assert "Göteborg, Sweden" in text, "Gothenburg Volvo role location missing"
          assert "Selected Leadership Impact" not in text, "Duplicated impact section must be absent"
          print(f"Strict parser validated {path}: {len(data)} bytes, {len(reader.pages)} page(s)")
          PY

      - name: Validate with standard PDF tools and renderer
        env:
          PYTHONPATH: src
        run: |
          PDF="static/$(python -c 'import site_cv; print(site_cv.CV_FILENAME)')"
          qpdf --check "$PDF"
          pdfinfo "$PDF"
          mkdir -p /tmp/cv-render
          pdftoppm -f 1 -singlefile -png -r 120 "$PDF" /tmp/cv-render/page >/dev/null
          test -s /tmp/cv-render/page.png
          file /tmp/cv-render/page.png

      - name: Build and validate recruitment-ready PDF
        env:
          PYTHONPATH: src
        run: |
          python -m site_cv_ats
          libreoffice -env:UserInstallation=file:///tmp/cv-lo --headless --convert-to pdf --outdir static static/Jair_Ribeiro_CV_ATS.docx
          qpdf --check static/Jair_Ribeiro_CV_ATS.pdf
          python - <<'PY'
          from docx import Document
          from pypdf import PdfReader
          from pathlib import Path
          doc = Document('static/Jair_Ribeiro_CV_ATS.docx')
          p = [x.text for x in doc.paragraphs]
          assert p.count('Work Experience') == 1
          assert p.count('Education') == 1
          assert p.count('Languages') == 1
          assert not doc.tables
          pdf = PdfReader('static/Jair_Ribeiro_CV_ATS.pdf', strict=True)
          text = ' '.join(' '.join(page.extract_text().split()) for page in pdf.pages)
          for value in ('MSX International', 'Volvo Group', 'Kimberly-Clark', 'IBM', 'Hewlett Packard Enterprise', 'Imprendo Consulting', 'CityLife', 'AXA Assicurazioni', 'PeopleLab', 'Selinus University', 'Swedish - Elementary (CEFR A2)'):
              assert any(value in line for line in p), value
              assert value in text, value
          assert len(pdf.pages) >= 2
          print('Validated recruitment PDF:', len(p), 'paragraphs,', len(pdf.pages), 'PDF pages')
          PY

      - name: Commit refreshed canonical and recruitment CVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f static/Jair_Ribeiro_CV_ATS.docx
          git add static/Jair_Ribeiro_CV.pdf static/Jair_Ribeiro_CV_ATS.pdf
          git add -u -- static/
          if ! git diff --cached --quiet; then
            git commit -m "build(cv): refresh executive and recruitment CV formats"
            # Portfolio edits may land while PDF validation is running.
            # Rebase the generated artifact onto the current branch before pushing.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
