name: Release AI governance briefing v2 visual bundle
on:
  push:
    branches: [main]
    paths:
      - 'scripts/release_policy_governance_v2.py'
      - 'docs/briefing_revisions/policy-is-not-permission-v2.json'
      - '.github/workflows/policy-governance-v2-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install image and PDF libraries
        run: python -m pip install 'Pillow==11.3.0' 'reportlab==4.4.4' 'pypdf==6.1.3' 'fpdf2==2.8.5' 'streamlit==1.64.0' 'bleach==6.2.0'
      - name: Generate reviewed source-locked desktop, mobile, PDF and 16:9 cover
        run: python scripts/release_policy_governance_v2.py
      - name: Verify checksums, image bytes, A4 PDF and shared rendering gates
        run: |
          PYTHONPATH=src python -m unittest -v tests.test_briefing_approved_asset_renderer
          PYTHONPATH=src python - <<'PY'
          from briefing_approved_asset_renderer import load_bundle,validate_bundle
          from pathlib import Path
          from PIL import Image
          from pypdf import PdfReader
          b=load_bundle('policy-is-not-permission-executive-ai-governance')
          assert b and b['revision']=='2026-11-07-r3'
          validate_bundle(b)
          root=Path('static/briefing-artwork')/b['slug']
          for k in ('desktop','mobile'):
              im=Image.open(root/b[k]['file']);im.load();assert im.mode=='RGB'
          pdf=PdfReader(str(root/'infographic.pdf'),strict=True);assert len(pdf.pages)==1
          print('Verified source-locked images and PDF; browser/device still requires separate QA.')
          PY
      - name: Commit reviewed artwork assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/briefing-artwork/policy-is-not-permission-executive-ai-governance/
          if ! git diff --cached --quiet; then
            git commit -m 'Release approved governance infographic footer, PDF and cover v2'
            for attempt in 1 2 3 4; do
              git pull --rebase origin main || exit 1
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
