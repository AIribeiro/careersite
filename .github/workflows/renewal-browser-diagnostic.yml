name: Diagnose live Renewal briefing rendering
on:
  push:
    branches: [main]
    paths: ['.github/workflows/renewal-browser-diagnostic.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          python -m pip install --quiet playwright==1.58.0
          python -m playwright install chromium
      - name: Inspect real DOM on Streamlit and branded domain
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright
          slug='would-you-fund-the-same-ai-initiatives-today'
          urls=['https://jairribeiro-ai.streamlit.app/?page=briefing&article='+slug+'&source=internal_qa',
                'https://jairribeiro.com/?page=briefing&article='+slug+'&source=internal_qa']
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            page=browser.new_page(viewport={'width':1440,'height':900})
            page.on('pageerror',lambda e:print('JS PAGE ERROR:',str(e)[:500],flush=True))
            for url in urls:
              print('REQUESTED URL:',url,flush=True)
              try:response=page.goto(url,wait_until='domcontentloaded',timeout=30000)
              except Exception as e:
                print('NAVIGATION ERROR',type(e).__name__,str(e)[:600],flush=True)
                continue
              print('STATUS:',response.status if response else None,flush=True)
              time.sleep(14)
              print('FINAL URL:',page.url,'TITLE:',page.title(),flush=True)
              print('BODY:',repr(page.locator('body').inner_text(timeout=6000)[:1800]),flush=True)
              for f in page.frames:
                print('FRAME:',f.url[:320],flush=True)
                try:
                  print(' FRAME BODY:',repr(f.locator('body').inner_text(timeout=4000)[:450]),flush=True)
                except Exception as e: print('FRAME ERROR:',str(e)[:200],flush=True)
              for selector in ['.site','.site .briefing-preview-hero h1','.site .briefing-reader','.site .hero h1','[data-testid="stApp"]']:
                print('SELECTOR',selector,'COUNT',page.locator(selector).count(),flush=True)
              try:page.screenshot(path='diag-'+('brand' if 'jairribeiro.com' in url else 'streamlit')+'.png',full_page=True,timeout=12000)
              except Exception as e: print('SCREENSHOT ERROR:',type(e).__name__,str(e)[:300],flush=True)
            browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renewal-live-browser-diagnostics
          path: diag-*.png
          retention-days: 1
