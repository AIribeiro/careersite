name: Release approved fifteen-outcome image and one-page A4 PDF
on:
  push:
    branches: [main]
    paths:
      - 'assets/approved_infographics/15-ways-ai-can-change-your-business.png'
      - 'scripts/build_ai_business_changes_approved_artwork.py'
      - 'tests/test_ai_business_changes_approved_artwork.py'
      - '.github/workflows/ai-business-changes-15-artwork.yml'
  workflow_dispatch:
concurrency:
  group: fifteen-outcome-briefing-artwork-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install image and PDF tooling
        run: python -m pip install -r requirements.txt 'reportlab==4.4.4'
      - name: Verify approved PNG and exactly one A4 PDF page
        run: |
          PYTHONPATH=src python -m unittest -v tests.test_ai_business_changes_approved_artwork
          python scripts/build_ai_business_changes_approved_artwork.py --output /tmp/approved-15ways
      - name: Package source-locked responsive artwork and one-page PDF
        run: |
          rm -rf static/briefing-artwork/15-ways-ai-can-change-your-business
          python scripts/build_briefing_artwork_bundle.py \
            --slug 15-ways-ai-can-change-your-business \
            --article-fingerprint 2bcd87f56aad0b87d2502d3dc435bc92957e9998bab7cc0c09bbae86356c4979 \
            --revision 2026-11-07-r6 \
            --desktop /tmp/approved-15ways/desktop.png \
            --mobile /tmp/approved-15ways/mobile.png \
            --pdf /tmp/approved-15ways/infographic.pdf \
            --heading "15 ways AI can change your business" \
            --deck "Fifteen business changes and one value test, illustrated in the exact owner-approved visual."
      - name: Confirm source identity, full image, one-page PDF and common HTML renderer
        run: |
          PYTHONPATH=src python -m unittest -v tests.test_briefing_approved_asset_renderer
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from pypdf import PdfReader
          from src.briefing_approved_asset_renderer import load_bundle,validate_bundle
          root=Path("static/briefing-artwork")
          b=load_bundle("15-ways-ai-can-change-your-business",asset_root=root)
          assert b and b["article_fingerprint"]=="2bcd87f56aad0b87d2502d3dc435bc92957e9998bab7cc0c09bbae86356c4979"
          assert b["revision"]=="2026-11-07-r6"
          assert b["pdf"]["pages"]==1
          validate_bundle(b)
          for k in ("desktop","mobile"):
              with Image.open(root/b["slug"]/b[k]["file"]) as im:
                  assert im.size==(1055,1491)
                  im.verify()
          with (root/b["slug"]/b["pdf"]["file"]).open("rb") as p:
              doc=PdfReader(p,strict=True)
              assert len(doc.pages)==1
          print("Published master identity, both images and one-page A4 verified")
          PY
      - name: Commit updated WebPs, PDF and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/briefing-artwork/15-ways-ai-can-change-your-business/
          if ! git diff --cached --quiet; then
            git commit -m "Publish approved exact-image briefing with one-page A4 PDF"
            for attempt in 1 2 3 4; do
              git pull --rebase origin main || exit 1
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
