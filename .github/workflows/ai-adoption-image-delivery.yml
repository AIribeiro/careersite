name: AI Adoption inline image delivery

on:
  push:
    paths:
      - '.github/workflows/ai-adoption-image-delivery.yml'
      - 'static/ai_adoption_leadership_response_map_source.png'
      - 'src/briefing_adoption_artwork.py'
      - 'src/briefing_infographic_store.py'
      - 'src/page_executive_briefings.py'
      - 'tests/test_briefing_adoption_studio.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embed-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production Streamlit, raster and browser dependencies
        run: |
          python -m pip install --disable-pip-version-check 'streamlit==1.64.0' 'CairoSVG==2.8.2' 'Pillow==12.3.0' 'playwright==1.58.0'
          python -m playwright install chromium
          python -m playwright install --with-deps webkit
      - name: Rebuild all artwork from the exact approved image
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat, ImageChops
          import hashlib
          root=Path("static")
          original=root/"ai_adoption_leadership_response_map_source.png"
          raw=original.read_bytes()
          expected="5bcacf58c3978e33047a3ed1e1127a11093b73feeac97d8efbea5628a9163a18"
          assert hashlib.sha256(raw).hexdigest()==expected, "Approved art source mismatch"
          full=Image.open(original).convert("RGB")
          assert full.size==(1086,1448), full.size
          assert min(ImageStat.Stat(full).stddev)>40, "Source appears blank"
          assets=[
              ("briefing-ai-adoption-studio",full,92),
              ("briefing-ai-adoption-studio-mobile",
                  full.resize((864,1152),Image.Resampling.LANCZOS),90),
          ]
          for stem,image,quality in assets:
              png=root/(stem+".png")
              webp=root/(stem+".webp")
              image.save(png,format="PNG",optimize=True)
              image.save(webp,format="WEBP",quality=quality,method=6)
              assert webp.stat().st_size<350_000, (stem,webp.stat().st_size)
              with Image.open(webp) as check:
                  check.verify()
              print(f"APPROVED ART {stem} {image.size}, {webp.stat().st_size:,} webp bytes")
          # Use a real crop of the new design, not the old library artwork.
          thumb=full.crop((0,0,1086,445))
          thumb=thumb.resize((900,369),Image.Resampling.LANCZOS)
          thumbnail=root/"briefing-ai-adoption-studio-thumbnail.webp"
          thumb.save(thumbnail,format="WEBP",quality=90,method=6)
          assert thumbnail.stat().st_size<100_000
          print("APPROVED THUMBNAIL",thumb.size,thumbnail.stat().st_size)
          PY
      - name: Check approved art contracts
        run: |
          python -m unittest discover -s tests -p 'test_briefing_adoption_studio.py' -v
          PYTHONPATH=src python - <<'PY'
          from briefing_adoption_artwork import artwork_data_uri
          for variant in ("desktop","mobile","thumbnail"):
              uri=artwork_data_uri(variant)
              assert uri.startswith("data:image/webp;base64,"), variant
              assert len(uri)<355000, (variant,len(uri))
              print("INLINED ART READY",variant,"characters",len(uri))
          PY
      - name: Launch the same st.html markup used by the public article
        run: |
          cat > _adoption_inline_smoke.py <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,str(Path(__file__).resolve().parent/"src"))
          import streamlit as st
          from briefing_adoption_artwork import artwork_data_uri
          desktop=artwork_data_uri("desktop")
          mobile=artwork_data_uri("mobile")
          thumb=artwork_data_uri("thumbnail")
          assert desktop and mobile and thumb
          st.title("Inline adoption image verification")
          st.html(
              '<style>'
              '.site .adoption-image{display:block;width:100%;height:auto;max-width:900px}'
              '.site .adoption-mobile{display:none}'
              '@media(max-width:700px){'
              '.site .adoption-desktop{display:none}'
              '.site .adoption-mobile{display:block}}'
              '</style>'
              '<div class="site">'
              '<img id="adoption-desktop" class="adoption-image adoption-desktop" src="' + desktop +
              '" alt="AI adoption infographic for desktop" loading="eager" decoding="async"/>'
              '<img id="adoption-mobile" class="adoption-image adoption-mobile" src="' + mobile +
              '" alt="AI adoption infographic for mobile" loading="eager" decoding="async"/>'
              '<img id="adoption-thumbnail" src="' + thumb +
              '" alt="AI adoption library card" loading="eager" decoding="async" '
              'style="display:block;width:220px;height:auto"/>'
              '</div>'
          )
          PY
          python -m streamlit run _adoption_inline_smoke.py --server.headless=true --server.port=8522 > /tmp/adoption-inline-smoke.log 2>&1 &
      - name: Browser QA of the actual inline picture in desktop and mobile layout
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              for browser_name,browser_type in (("Chromium",p.chromium),("WebKit",p.webkit)):
                  browser=browser_type.launch(headless=True)
                  for width,height in ((1200,900),(768,1024),(390,844)):
                      page=browser.new_page(viewport={"width":width,"height":height})
                      requests=[]
                      page.on("request",lambda req: requests.append(req.url) if "/app/static" in req.url else None)
                      page.goto("http://127.0.0.1:8522/",wait_until="domcontentloaded",timeout=30000)
                      visible="#adoption-mobile" if width<=700 else "#adoption-desktop"
                      hidden="#adoption-desktop" if width<=700 else "#adoption-mobile"
                      for selector in (visible,"#adoption-thumbnail"):
                          image=page.locator(selector)
                          image.wait_for(timeout=30000)
                          page.wait_for_function(
                              """(selector) => {
                                  const img=document.querySelector(selector);
                                  return !!(img && img.complete && img.naturalWidth>0 && img.naturalHeight>0);
                              }""",
                              arg=selector,timeout=30000
                          )
                          result=image.evaluate(
                              "(img) => ({width:img.naturalWidth,height:img.naturalHeight,display:getComputedStyle(img).display,src:img.currentSrc.slice(0,35)})"
                          )
                          assert result["src"].startswith("data:image/webp;base64,"),result
                          assert result["display"] != "none",result
                          print(f"{browser_name} RENDERED {width}px {selector}: {result}",flush=True)
                      assert page.locator(hidden).evaluate("(img)=>getComputedStyle(img).display") == "none"
                      assert not requests,requests
                      page.close()
                  browser.close()
          PY
      - name: Commit compact browser-verified artwork
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add static/briefing-ai-adoption-studio.png static/briefing-ai-adoption-studio-mobile.png
          git add static/briefing-ai-adoption-studio.webp static/briefing-ai-adoption-studio-mobile.webp static/briefing-ai-adoption-studio-thumbnail.webp
          if ! git diff --cached --quiet; then
            git commit -m "Publish compressed browser-verified inline AI Adoption assets [skip ci]"
            git push origin HEAD:main
          fi
      - name: Diagnostics if validation fails
        if: failure()
        run: |
          cat /tmp/adoption-inline-smoke.log || true
          ls -lah static/briefing-ai-adoption* || true
