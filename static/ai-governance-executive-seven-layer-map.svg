<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="864" viewBox="0 0 1536 864" role="img" aria-labelledby="gov-title gov-description">
<title id="gov-title">AI Governance Explained to Executives — seven connected governance layers</title>
<desc id="gov-description">A seven-layer AI governance operating model grouped into Foundation, Decisions and Execution, with business outcome, risk appetite and accountable ownership across all three. Foundation: information integrity and accountable ownership. Decisions: authority to decide, rules in the workflow, and risk and obligations. Execution: system assurance and bounded AI action.</desc>
