name: P0 production reachability check
on:
  push:
    paths:
      - ".github/workflows/p0-production-health.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public deployment independently of local CI
        shell: bash
        run: |
          set -u
          URL="https://jairribeiro-ai.streamlit.app/_stcore/health"
          for attempt in 1 2 3 4 5 6; do
            echo "Production health attempt ${attempt}/6"
            code="$(curl -L -sS --connect-timeout 8 --max-time 18 -o /tmp/cloud-health-response -w '%{http_code}' "$URL" || true)"
            echo "HTTP status: ${code:-unavailable}"
            if [ "$code" = "200" ]; then
              echo "PRODUCTION HEALTH REACHABLE: $URL"
              head -c 300 /tmp/cloud-health-response || true
              exit 0
            fi
            if [ -f /tmp/cloud-health-response ]; then
              head -c 300 /tmp/cloud-health-response || true
              echo
            fi
            sleep 10
          done
          echo "::error::Streamlit Community Cloud production health is unreachable; local CI success does not imply a healthy public deployment."
          exit 1
