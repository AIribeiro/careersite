name: Streamlit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application
        run: python -m py_compile app.py site_*.py page_*.py

      - name: Validate generated CV
        shell: python
        run: |
          from site_assets import CV_BYTES
          if not CV_BYTES.startswith(b'%PDF'):
              raise SystemExit('Generated CV is not a PDF')
          if len(CV_BYTES) < 5000:
              raise SystemExit('Generated CV is unexpectedly small')
          print(f'Validated generated CV ({len(CV_BYTES)} bytes)')

      - name: Start Streamlit
        run: |
          streamlit run app.py \
            --server.headless true \
            --server.port 8501 \
            > /tmp/streamlit.log 2>&1 &
          echo $! > /tmp/streamlit.pid

      - name: Health check
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "Streamlit health check passed"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/streamlit.log
          exit 1

      - name: Show Streamlit log on failure
        if: failure()
        run: cat /tmp/streamlit.log || true
