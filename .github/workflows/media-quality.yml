name: Media Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Validate canonical leadership photography
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          required = {
              "54907620908_f7c872f825_o.jpg": ((2400, 1500), 700_000),
              "IMG_0777.jpg": ((1600, 900), 700_000),
              "1700157848740.jpg": ((1600, 1000), 250_000),
              "54549047980_f668a9ffde_o Copy.JPG": ((1000, 800), 250_000),
              "IMG_8281.jpg": ((900, 1300), 700_000),
              "pixelup_1683528862014.jpg": ((1500, 1300), 400_000),
              "profile_red_bg.jpg.jpg": ((1600, 1000), 350_000),
          }

          root = Path("images")
          for name, ((min_w, min_h), min_bytes) in required.items():
              path = root / name
              if not path.is_file():
                  raise SystemExit(f"Missing canonical image: {path}")
              if path.stat().st_size < min_bytes:
                  raise SystemExit(
                      f"{name}: {path.stat().st_size} bytes; expected at least {min_bytes}"
                  )
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  width, height = image.size
                  if width < min_w or height < min_h:
                      raise SystemExit(
                          f"{name}: {width}x{height}; expected at least {min_w}x{min_h}"
                      )
                  print(f"{name}: {width}x{height}, {path.stat().st_size} bytes — OK")

          media_source = Path("src/site_media.py").read_text(encoding="utf-8")
          if "site_photos_bundle" in media_source or "_prepare_for_display" in media_source:
              raise SystemExit("Production media must use original /images files without recompression")
          PY
