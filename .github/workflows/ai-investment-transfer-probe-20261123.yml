name: AI investment approved media one-time transfer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ai-investment-transfer-probe-20261123.yml']
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Transfer exact approved MP4, poster and header through bounded Supabase Edge
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,json,datetime
          from pathlib import Path
          endpoint='https://rnqweoxtynelfirffmlr.supabase.co/functions/v1/ai-investment-media-once-20261123'
          request=urllib.request.Request(endpoint,method='POST',headers={'Content-Type':'application/json'},data=b'{}')
          try:
            with urllib.request.urlopen(request,timeout=170) as response:
              body=response.read(12000).decode('utf-8','replace')
              report={'http_status':response.status,'response':json.loads(body)}
          except urllib.error.HTTPError as e:
            report={'http_status':e.code,'response_text':e.read(12000).decode('utf-8','replace')}
          except Exception as e: report={'error':str(e)[:500]}
          report['observed_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          path=Path('docs/ai-investment-media-release-receipt-20261123.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2))
          PY
      - name: Commit exact upload verification receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai-investment-media-release-receipt-20261123.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified Article media transfer result [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
