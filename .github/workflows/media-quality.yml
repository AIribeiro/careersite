name: Media Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Validate high-resolution leadership photography
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          required = {
              "images/jair-conference-stage.webp": 1_500_000,
              "images/jair-leadership-workshop.webp": 1_000_000,
              "images/jair-panel-conversation.webp": 1_000_000,
          }

          for name, min_pixels in required.items():
              path = Path(name)
              if not path.exists():
                  raise SystemExit(f"Missing required leadership image: {name}")
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  width, height = image.size
                  pixels = width * height
                  if pixels < min_pixels:
                      raise SystemExit(
                          f"{name} is below the high-resolution threshold: "
                          f"{width}x{height} ({pixels:,} pixels)"
                      )
                  print(f"{name}: {width}x{height} ({pixels:,} pixels) — OK")
          PY
