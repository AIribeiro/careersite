name: Python syntax checks

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '.github/workflows/python-syntax.yml'
  pull_request:
    paths:
      - '**/*.py'
      - '.github/workflows/python-syntax.yml'
  workflow_dispatch:

jobs:
  compile-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax across the app
        run: python -m compileall -q main.py app.py src tests
