name: AI & Data Market Signals checks
on:
  pull_request:
    paths:
      - 'src/page_advisory_market_signals.py'
      - 'src/page_advisory_market_demo.py'
      - 'src/market_archive.py'
      - 'src/market_admin_refresh.py'
      - 'src/market_labelled_bars.py'
      - 'src/page_advisory_market_observatory.py'
      - 'src/page_owner_market_signals.py'
      - 'src/page_owner_advisory_management.py'
      - 'src/page_advisory_market_review.py'
      - 'src/market_review_premium.py'
      - 'src/advisory_service_visibility.py'
      - 'src/page_advisory_portal.py'
      - 'src/page_advisory_member_experience.py'
      - 'src/page_public_services.py'
      - 'src/page_reader_native.py'
      - 'src/site_reader_navigation.py'
      - 'tests/test_advisory_session_navigation.py'
      - 'main.py'
      - 'tests/test_market_signals.py'
      - 'tests/test_market_monthly_and_refresh.py'
      - 'tests/test_market_review_premium.py'
      - 'tests/test_market_signals_landing.py'
      - 'tests/test_market_signals_claims_contract.py'
      - 'tests/test_market_chart_labels.py'
      - 'tests/test_market_observatory.py'
      - 'tests/test_market_signals_management.py'
      - '.github/workflows/market-signals-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-and-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact portfolio dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile new and modified service routes
        run: |
          python -m py_compile main.py \
            src/page_advisory_market_signals.py \
            src/page_advisory_market_demo.py \
            src/market_archive.py \
            src/market_admin_refresh.py \
            src/market_labelled_bars.py \
            src/page_advisory_market_observatory.py \
            src/page_owner_market_signals.py \
            src/page_owner_advisory_management.py \
            src/page_advisory_market_review.py \
            src/market_review_premium.py \
            src/advisory_service_visibility.py \
            src/page_advisory_portal.py \
            src/page_advisory_member_experience.py \
            src/page_public_services.py \
            src/page_reader_native.py \
            src/site_reader_navigation.py \
            tests/test_market_signals.py \
            tests/test_market_monthly_and_refresh.py \
            tests/test_market_review_premium.py \
            tests/test_market_signals_landing.py \
            tests/test_market_signals_claims_contract.py \
            tests/test_market_chart_labels.py \
            tests/test_market_observatory.py \
            tests/test_market_signals_management.py
      - name: Verify evidence integrity and PDF export
        run: python -m unittest discover -s tests -p 'test_market_signals.py' -v
      - name: Validate complete executive research PDF, evidence register and layout
        run: python -m unittest discover -s tests -p 'test_market_review_premium.py' -v
      - name: Render researched PDF into QA images and verify legibility
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "src")
          sys.path.insert(0, "tests")
          from test_market_review_premium import verified_edition_fixture
          from page_advisory_market_review import market_review_pdf
          points,briefs=verified_edition_fixture()
          path=Path("/tmp/market-review-qa.pdf")
          path.write_bytes(market_review_pdf(
              points,briefs,{"issue_date":"2026-11-16","status":"published"}
          ))
          print("Rendered approved 30-observation synthetic QA manuscript:",path.stat().st_size,"bytes")
          PY
          python -m pip install --quiet pymupdf==1.26.7
          mkdir -p /tmp/market-review-renders
          python - <<'PY'
          import pymupdf
          from PIL import Image,ImageStat
          from pathlib import Path
          doc=pymupdf.open("/tmp/market-review-qa.pdf")
          assert doc.page_count>=13,("Unexpected page count",doc.page_count)
          pages=[0,1,2,3,6,7,8,13,14]
          print(f"Research QA: {doc.page_count} A4 pages")
          for n in pages:
              page=doc[n]
              assert abs(page.rect.width-595.28)<.5
              assert abs(page.rect.height-841.89)<.5
              assert len(page.get_text().strip())>100
              for item in page.get_text("dict")["blocks"]:
                  for line in item.get("lines",[]):
                      for span in line["spans"]:
                          if span["text"].strip():
                              assert page.rect.contains(pymupdf.Rect(span["bbox"])),(n,span["text"][:50],span["bbox"])
              path=Path(f"/tmp/market-review-renders/page-{n+1:02d}.png")
              page.get_pixmap(matrix=pymupdf.Matrix(1.4,1.4),alpha=False).save(path)
              im=Image.open(path).convert("RGB")
              assert im.width>800 and im.height>1100,(path,im.size)
              stat=ImageStat.Stat(im)
              assert min(stat.stddev)>8,(path,stat.stddev)
              print(f"{path.name}: {im.width}x{im.height}, variance={[round(v,1) for v in stat.stddev]}")
          PY
      - name: Render and inspect public earliest-data PDF
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import pymupdf
          sys.path.insert(0,"src")
          from page_advisory_market_demo import public_historical_demo_pdf
          data=public_historical_demo_pdf()
          path=Path("/tmp/public-market-demo.pdf")
          path.write_bytes(data)
          doc=pymupdf.open(stream=data,filetype="pdf")
          assert doc.page_count>=4
          destination=Path("/tmp/market-review-renders")
          destination.mkdir(parents=True,exist_ok=True)
          for i,page in enumerate(doc):
              assert abs(page.rect.width-595.28)<.5
              assert abs(page.rect.height-841.89)<.5
              assert len(page.get_text().strip())>100
              for block in page.get_text("dict")["blocks"]:
                  for line in block.get("lines",[]):
                      for span in line["spans"]:
                          if span["text"].strip():
                              assert page.rect.contains(pymupdf.Rect(span["bbox"])),(i,span["text"][:40])
              page.get_pixmap(matrix=pymupdf.Matrix(1.4,1.4),alpha=False).save(
                  destination/f"public-demo-{i+1:02d}.png"
              )
          print("Public oldest-data demo rendered and geometry checked:",len(data),"bytes,",doc.page_count,"pages")
          PY
      - name: Upload synthetic QA PDF and page renders
        uses: actions/upload-artifact@v4
        with:
          name: market-review-qa-renders
          path: |
            /tmp/market-review-qa.pdf
            /tmp/public-market-demo.pdf
            /tmp/market-review-renders/*.png
          retention-days: 7
      - name: Verify full-length mobile chart labels and sanitisation
        run: python -m unittest discover -s tests -p 'test_market_chart_labels.py' -v
      - name: Verify premium Market Signals public landing and access links
        run: python -m unittest discover -s tests -p 'test_market_signals_landing.py' -v
      - name: Verify reader promises against actual reports, evidence and approved dashboards
        run: python -m unittest discover -s tests -p 'test_market_signals_claims_contract.py' -v
      - name: Verify monthly archives, all-source refresh and public historic PDF
        run: python -m unittest discover -s tests -p 'test_market_monthly_and_refresh.py' -v
      - name: Verify market observatory and public-data isolation
        run: python -m unittest discover -s tests -p 'test_market_observatory.py' -v
      - name: Verify new public demo in session-preserving navigation
        run: python -m unittest discover -s tests -p 'test_advisory_session_navigation.py' -v
      - name: Verify owner operations and publication-control boundaries
        run: python -m unittest discover -s tests -p 'test_market_signals_management.py' -v
