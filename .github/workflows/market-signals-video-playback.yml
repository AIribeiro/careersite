name: Market Signals video playback
on:
  push:
    branches: [main]
    paths:
      - "src/page_advisory_market_signals.py"
      - "static/market-signals/**"
      - ".github/workflows/market-signals-video-playback.yml"
  pull_request:
    paths:
      - "src/page_advisory_market_signals.py"
      - "static/market-signals/**"
      - ".github/workflows/market-signals-video-playback.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Chromium
        run: |
          python -m pip install --quiet playwright==1.58.0
          python -m playwright install chromium
      - name: Verify the exact player origin supports iPhone media-range requests
        run: |
          python - <<'PY'
          import requests
          url="https://cdn.jsdelivr.net/gh/AIribeiro/careersite@2093b70e912f2223462c7bd42f77ccfa73911d83/static/market-signals/market-review-november-2026.mp4"
          response=requests.get(url,headers={"Range":"bytes=0-1023"},timeout=18,stream=True)
          assert response.status_code==206,response.status_code
          assert response.headers.get("Content-Type","").startswith("video/mp4"),response.headers
          assert response.headers.get("Content-Range")=="bytes 0-1023/4127057",response.headers
          response.close()
          print("PASS: real 206 partial video/mp4 from pinned CDN")
          PY
      - name: Assert first video frame decodes and time advances
        run: |
          python - <<'PY'
          import ast,json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          tree=ast.parse(Path("src/page_advisory_market_signals.py").read_text())
          html=""
          for node in tree.body:
              if isinstance(node,ast.Assign):
                  for target in node.targets:
                      if isinstance(target,ast.Name) and target.id=="MARKET_SIGNALS_LANDING_HTML":
                          html=ast.literal_eval(node.value)
          assert 'cdn.jsdelivr.net' in html
          video=html.split('<video class="ms-video-player"',1)[1].split('</video>',1)[0]
          h='<!doctype html><html><body><video id="v"'+video+'</video></body></html>'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=["--autoplay-policy=no-user-gesture-required"])
              for w in (390,1440):
                  page=browser.new_page(viewport={"width":w,"height":844},is_mobile=w==390,has_touch=w==390)
                  page.set_content(h)
                  player=page.locator("#v")
                  result=player.evaluate("""async v => await Promise.race([v.play().then(()=> 'resolved').catch(e=>e.name),new Promise(r=>setTimeout(()=>r('no-response'),6500))])""")
                  page.wait_for_timeout(3200)
                  props=player.evaluate("""v=>({duration:v.duration,currentTime:v.currentTime,readyState:v.readyState,networkState:v.networkState,error:v.error?.code,videoWidth:v.videoWidth,videoHeight:v.videoHeight,source:v.currentSrc})""")
                  print("PLAYBACK TEST",w,result,json.dumps(props),flush=True)
                  assert props["error"] is None,props
                  assert props["videoWidth"]>=500 and props["duration"]>57,props
                  assert props["currentTime"]>=1.0,(result,props)
                  page.close()
              browser.close()
          PY
