name: Renew AI portfolio A4 vector infographic PDF
on:
  push:
    branches: [main]
    paths:
      - 'scripts/renewal_a4_vector_pdf.py.xz.b64'
      - '.github/workflows/renewal-vector-a4-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: renewal-vector-a4-release
  cancel-in-progress: true
jobs:
  create-verify-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact vector composition source
        run: |
          python - <<'PY'
          import base64, lzma, hashlib
          from pathlib import Path
          encoded=Path('scripts/renewal_a4_vector_pdf.py.xz.b64').read_text().strip()
          source=lzma.decompress(base64.b64decode(encoded,validate=True))
          expected='379b653d0be828265589330315be137dd1f4534ef83cc0a0d3bf5a82c64cecfd'
          assert hashlib.sha256(source).hexdigest()==expected,'Vector PDF source changed'
          Path('scripts/renewal_a4_vector_pdf.py').write_bytes(source)
          print('Source SHA verified',expected)
          PY
      - name: Install verified PDF dependencies
        run: |
          python -m pip install reportlab==4.4.9 pypdf==6.5.0 pillow==12.0.0
      - name: Render an independent A4 print edition and verify vector text
        run: |
          python scripts/renewal_a4_vector_pdf.py --out /tmp/renewal-vector-v4.pdf
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          from pypdf import PdfReader
          s='would-you-fund-the-same-ai-initiatives-today'
          directory=Path('static/briefing-artwork')/s
          manifest_path=directory/'manifest.json'
          manifest=json.loads(manifest_path.read_text())
          expected='b9e255ca0e7ac9fdf7504e98fe07dd9e8f642c96c4e492d6aac4adf511c27bd5'
          assert manifest['article_fingerprint']==expected
          assert manifest['slug']==s
          current=manifest.get('revision','')
          assert current in ('v3-premium-editorial-20261116','v4-vector-print-20261116'),current
          src=Path('/tmp/renewal-vector-v4.pdf')
          data=src.read_bytes()
          assert data.startswith(b'%PDF-') and len(data)>30000
          pdf=PdfReader(src,strict=True)
          assert len(pdf.pages)==1
          page=pdf.pages[0]
          assert abs(float(page.mediabox.width)-595.28)<1
          assert abs(float(page.mediabox.height)-841.89)<1
          assert len(page.images)==0,'A4 edition must contain no raster images'
          text=page.extract_text() or ''
          for phrase in ('Would you fund the same','AI initiatives today?','THE LEADERSHIP STANDARD','RENEW','REPLACE','TEST','STOP','Continuing is a decision, not a default.'):
              assert phrase in text, 'A4 editorial content missing: '+phrase
          target=directory/'infographic-a4-vector-v4.pdf'
          shutil.copyfile(src,target)
          manifest['revision']='v4-vector-print-20261116'
          manifest['pdf']={
            'file':target.name,
            'sha256':hashlib.sha256(data).hexdigest(),
            'pages':1,
            'format':'vector',
            'bytes':len(data),
          }
          manifest_path.write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          print('A4 PDF verified:',len(data),'bytes, 1 page, vector fonts, no raster images, SHA',manifest['pdf']['sha256'])
          PY
      - name: Commit new immutable PDF and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/renewal_a4_vector_pdf.py static/briefing-artwork/would-you-fund-the-same-ai-initiatives-today/manifest.json static/briefing-artwork/would-you-fund-the-same-ai-initiatives-today/infographic-a4-vector-v4.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Release crisp vector A4 Renewal Challenge PDF (v4)"
            for attempt in 1 2 3 4; do
              git pull --rebase origin main || exit 1
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
