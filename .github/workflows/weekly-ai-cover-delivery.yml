name: Weekly AI cover delivery

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'src/thinking_weekly_brief.py'
      - 'src/site_cms.py'
      - 'static/weekly-ai/**'
      - 'assets/weekly_ai_evergreen_visual.webp'
      - 'tests/test_weekly_ai_cover_delivery.py'
      - '.github/workflows/weekly-ai-cover-delivery.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app.py'
      - 'src/thinking_weekly_brief.py'
      - 'src/site_cms.py'
      - 'static/weekly-ai/**'
      - 'assets/weekly_ai_evergreen_visual.webp'
      - 'tests/test_weekly_ai_cover_delivery.py'
      - '.github/workflows/weekly-ai-cover-delivery.yml'

permissions:
  contents: read

jobs:
  verify-cover:
    # Playwright 1.58 supports Ubuntu 24.04; ubuntu-latest may resolve to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify slug-based cover fallback and social metadata
        run: python -m unittest tests.test_weekly_ai_cover_delivery -v

      - name: Start first-party media server
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > /tmp/weekly-cover-app.log 2>&1 &
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/weekly-cover-app.log
          exit 1

      - name: Verify latest Friday cover and evergreen are HTTP-served
        run: |
          SLUG="$(find static/weekly-ai -maxdepth 1 -name 'weekly-ai-*.png' -printf '%f\n' | sort | tail -n 1 | sed 's/\.png$//')"
          test -n "$SLUG"
          curl --fail --silent --show-error \
            --dump-header /tmp/weekly-cover.headers \
            --output /tmp/weekly-cover-served.png \
            "http://127.0.0.1:8501/weekly-ai-cover/$SLUG.png"
          curl --fail --silent --show-error \
            --output /tmp/weekly-evergreen-served.webp \
            'http://127.0.0.1:8501/weekly-ai-cover/evergreen.webp'
          python - "$SLUG" <<'PY'
          from pathlib import Path
          from PIL import Image
          import sys

          slug = sys.argv[1]
          expected = (Path("static") / "weekly-ai" / f"{slug}.png").read_bytes()
          served = Path("/tmp/weekly-cover-served.png").read_bytes()
          assert served == expected, "The public media route changed the approved cover bytes"
          with Image.open("/tmp/weekly-cover-served.png") as image:
              assert image.format == "PNG" and image.size == (1200, 627), image.size
          with Image.open("/tmp/weekly-evergreen-served.webp") as image:
              assert image.format == "WEBP"
          headers = Path("/tmp/weekly-cover.headers").read_text().lower()
          assert "content-type: image/png" in headers, headers
          assert "cache-control: public" in headers, headers
          print("First-party Friday and evergreen cover delivery passed:", slug)
          PY

      - name: Verify actual Streamlit article image in Chromium
        run: |
          python -m pip install --quiet playwright==1.58.0
          python -m playwright install chromium
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          target = "http://127.0.0.1:8501/?page=thinking&article=weekly-ai-2026-11-06"
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 900})
              page.goto(target, wait_until="domcontentloaded", timeout=45000)
              page.wait_for_selector(".site .weekly-ai-edition-cover img", timeout=45000)
              page.wait_for_function(
                  """() => {
                    const img = document.querySelector('.site .weekly-ai-edition-cover img');
                    return !!(img && img.complete && img.naturalWidth === 1200
                      && img.naturalHeight === 627
                      && img.getAttribute('src')?.startsWith('data:image/png;base64,'));
                  }""",
                  timeout=20000,
              )
              img = page.locator(".site .weekly-ai-edition-cover img").first
              print("Chromium rendered the original Week 45 reader image:",
                    img.evaluate("(element) => [element.naturalWidth, element.naturalHeight]"))
              browser.close()
          PY

      - name: Verify deployed Week 45 header in a real browser
        if: github.event_name == 'push'
        env:
          SITE_URL: https://jairribeiro-ai.streamlit.app/
        run: |
          python - <<'PY'
          import os
          import time
          from playwright.sync_api import sync_playwright

          target = os.environ["SITE_URL"].rstrip("/") + "/?page=thinking&article=weekly-ai-2026-11-06"
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 900})
              last_error = ""
              for attempt in range(1, 3):
                  try:
                      page.goto(target, wait_until="domcontentloaded", timeout=45000)
                      page.wait_for_selector(".site .weekly-ai-edition-cover img", timeout=20000)
                      page.wait_for_function(
                          """() => {
                            const image = document.querySelector('.site .weekly-ai-edition-cover img');
                            return Boolean(image && image.complete &&
                              image.naturalWidth === 1200 && image.naturalHeight === 627 &&
                              image.getAttribute('src')?.startsWith('data:image/png;base64,'));
                          }""",
                          timeout=12000,
                      )
                      print("LIVE WEEKLY AI cover image displayed at 1200x627", flush=True)
                      break
                  except Exception as exc:
                      last_error = f"{type(exc).__name__}: {str(exc)[:250]}"
                      count = page.locator(".site .weekly-ai-edition-cover img").count()
                      try:
                          body = page.locator("body").inner_text(timeout=6000)[:600]
                          site_count = page.locator(".site").count()
                          article_count = page.locator(".site .weekly-ai-reader").count()
                          title = page.title()
                          print(f"Public diagnostic: url={page.url!r} title={title!r} "
                                f"site_count={site_count} reader_count={article_count} "
                                f"body={body!r}", flush=True)
                      except Exception as diagnosis:
                          print(f"Public diagnostic failed: {diagnosis!r}", flush=True)
                      print(f"Live check {attempt}/2: image elements={count}, error={last_error}",
                            flush=True)
                      if attempt == 2:
                          raise SystemExit("Production Week 45 header image not verified: " + last_error)
                      time.sleep(8)
              browser.close()
          PY

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/weekly-cover-app.log || true
