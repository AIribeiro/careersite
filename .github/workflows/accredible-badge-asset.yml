name: Accredible Badge Asset

on:
  push:
    paths:
      - ".github/workflows/accredible-badge-asset.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original Databricks GenAI badge artwork
        run: |
          set -euo pipefail
          mkdir -p images/credentials
          curl --fail --location --retry 3 \
            "https://templates.images.credential.net/17582016259615109453927759079417.png" \
            -o images/credentials/databricks_genai_fundamentals.png
          file images/credentials/databricks_genai_fundamentals.png
      - name: Commit badge artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/credentials/databricks_genai_fundamentals.png
          git commit -m "Add original Databricks Generative AI Fundamentals badge"
          git push
