name: Media Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Validate high-resolution leadership photography
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          required = {
              "images/jair-hero-executive.webp": (2000, 1300),
              "images/jair-ai-panel.webp": (2000, 1300),
              "images/jair-leadership-workshop.webp": (3000, 2000),
              "images/jair-panel-dialogue.webp": (3000, 2000),
              "images/jair-thinking-panel.webp": (1900, 1300),
              "images/jair-about-bw.webp": (1000, 1500),
          }

          for name, (min_width, min_height) in required.items():
              path = Path(name)
              if not path.exists():
                  raise SystemExit(f"Missing required leadership image: {name}")
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  width, height = image.size
                  if width < min_width or height < min_height:
                      raise SystemExit(
                          f"{name} is below the display-quality threshold: "
                          f"{width}x{height}; expected at least {min_width}x{min_height}"
                      )
                  print(f"{name}: {width}x{height} — OK")
          PY
