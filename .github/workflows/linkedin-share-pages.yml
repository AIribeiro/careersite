name: Social Share Pages

on:
  push:
    branches: [main]
    paths:
      - "src/thinking_articles.py"
      - "src/thinking_social.py"
      - "src/site_shortlinks.py"
      - "src/weekly_ai_shortlink_registry.json"
      - "static/weekly-ai/*.png"
      - "src/weekly_ai_brand_cover.py"
      - "scripts/generate_weekly_ai_covers.py"
      - "scripts/build_linkedin_share_site.py"
      - "scripts/build_agent_discovery_static.py"
      - "scripts/discovery_search_surface.py"
      - "scripts/indexnow_discovery.py"
      - "scripts/verify_agent_discovery_live.py"
      - "src/agent_discovery.py"
      - "static/thinking-visuals/**"
      - ".github/workflows/linkedin-share-pages.yml"
  workflow_dispatch:
  # CMS publications do not always create repository commits. Refresh the
  # summary-only Pages mirror regularly without modifying Streamlit readers.
  schedule:
    - cron: "23 */2 * * *"
  # Audio and the branded cover are committed by the Weekly AI workflow's bot;
  # those bot pushes do not trigger ordinary push workflows.
  workflow_run:
    workflows: ["Weekly AI audio"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Capture previously published discovery state
        run: python scripts/indexnow_discovery.py snapshot --output _previous_agent_state.json

      - name: Build static social share site
        run: python scripts/build_linkedin_share_site.py --output _share_site --share-base https://airibeiro.github.io/careersite

      - name: Build public AI discovery mirror from live CMS metadata
        run: |
          python scripts/build_agent_discovery_static.py --output _share_site --share-base https://airibeiro.github.io/careersite

      - name: Detect recently added, updated or removed public discovery pages
        run: |
          python scripts/indexnow_discovery.py diff --previous _previous_agent_state.json --current _share_site/agent/publication-state.json --output _share_site/agent/change-report.json

      - name: Prepare IndexNow ownership proof when configured
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python scripts/indexnow_discovery.py write-key --output _share_site --key "$INDEXNOW_KEY"

      - name: Validate generated social share page
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from thinking_articles import ARTICLES

          slug = 'when-an-ai-use-case-should-be-stopped'
          html = Path(f'_share_site/thinking/{slug}/index.html').read_text(encoding='utf-8')
          assert 'When an AI Use Case Should Be Stopped' in html
          assert 'property="og:type" content="article"' in html
          assert 'property="og:image"' in html
          assert 'article:published_time' in html
          assert 'name="twitter:card" content="summary_large_image"' in html
          assert 'name="twitter:image"' in html
          assert '/social-x/' in html
          assert 'name="twitter:image:alt"' in html
          assert 'utm_source' in html
          assert "source = 'x'" in html
          assert 'window.location.replace' in html

          linkedin_image = Path(f'_share_site/social/{slug}.png')
          with Image.open(linkedin_image) as im:
              assert im.format == 'PNG'
              assert im.size == (1200, 627)

          x_image = Path(f'_share_site/social-x/{slug}.jpg')
          with Image.open(x_image) as im:
              assert im.format == 'JPEG'
              assert im.size == (1200, 600)

          assert x_image.stat().st_size < 1_000_000

          from site_shortlinks import registered_short_links, short_article_link, short_briefing_link, daily_quote_short_link, weekly_ai_short_link
          from html import escape, unescape
          for code, slug, channel, target in registered_short_links():
              page = Path(f'_share_site/go/{code}/index.html')
              assert page.is_file(), f'Missing redirect for {code}'
              markup = page.read_text(encoding='utf-8')
              assert '<meta http-equiv="refresh"' in markup
              assert 'window.location.replace(' in markup
              assert escape(target, quote=True) in markup
              from urllib.parse import parse_qs, urlsplit
              q = parse_qs(urlsplit(target).query)
              assert f"?page={q.get('page', ['thinking'])[0]}&amp;article={slug}" in markup
              role = q.get('role', [''])[0]
              if role == 'weeklyai':
                  actual = weekly_ai_short_link(
                      slug, channel, campaign=q['utm_campaign'][0], content=q['utm_content'][0],
                  )
              elif role == 'dailyquote':
                  actual = daily_quote_short_link(
                      slug, channel, campaign=q['utm_campaign'][0],
                  )
              elif q.get('page') == ['briefing']:
                  actual = short_briefing_link(slug, channel)
              else:
                  actual = short_article_link(slug, channel)
              assert actual and actual.endswith(f'/go/{code}/')
          # The Friday social cover is generated from the immutable approved portrait.
          # Each registered release must have a matching 1.91:1 branded preview after
          # the audio/cover workflow commits the approved generated PNG.
          import json
          from site_shortlinks import registered_short_links
          registry = json.loads(Path('src/weekly_ai_shortlink_registry.json').read_text())
          for edition in registry['editions']:
              if edition.get('distribution_mode') != 'friday_wrap':
                  continue
              slug = edition['slug']
              cover = Path(f'static/weekly-ai/{slug}.png')
              if not cover.is_file():
                  print(f'Friday cover not yet committed for {slug}; using safe fallback')
                  continue
              preview = Path(f'_share_site/social/{slug}.png')
              preview_x = Path(f'_share_site/social-x/{slug}.jpg')
              assert preview.is_file() and preview_x.is_file(), slug
              with Image.open(preview) as im:
                  assert im.format == 'PNG' and im.size == (1200, 627), slug
              with Image.open(preview_x) as im:
                  assert im.format == 'JPEG' and im.size == (1200, 600), slug
              for code, row_slug, _channel, _target in registered_short_links():
                  if row_slug == slug and code.startswith('f'):
                      short_markup = Path(f'_share_site/go/{code}/index.html').read_text()
                      assert f'/social/{slug}.png' in short_markup, code
                      assert edition['edition_title'] in unescape(short_markup), code
          agent_dir = Path("_share_site")
          catalog = json.loads((agent_dir / "agent" / "catalog.json").read_text(encoding="utf-8"))
          assert catalog["catalogue_status"] == "complete"
          assert catalog["content_policy"] == "summary_only"
          assert catalog["count"] >= len(ARTICLES)
          assert (agent_dir / "llms.txt").is_file()
          assert (agent_dir / "agents.md").is_file()
          assert "https://airibeiro.github.io/careersite/agent/catalog.json" in (agent_dir / "llms.txt").read_text(encoding="utf-8")
          assert all(item["url"].startswith("https://jairribeiro.com/") for item in catalog["content"])
          assert all(item["markdown_url"].startswith("https://airibeiro.github.io/careersite/agent/content/") for item in catalog["content"])
          for item in catalog["content"]:
              markdown = (agent_dir / "agent" / "content" / (item["slug"] + ".md")).read_text(encoding="utf-8")
              assert item["title"] in markdown, item["slug"]
              assert "## Full public edition" not in markdown, item["slug"]
              assert "content_html" not in markdown, item["slug"]
          from xml.etree import ElementTree as ET
          assert (agent_dir / "discover/index.html").is_file()
          assert (agent_dir / "robots.txt").is_file()
          assert (agent_dir / "feed.xml").is_file()
          assert "OAI-SearchBot" in (agent_dir / "robots.txt").read_text()
          sitemap_root = ET.parse(agent_dir / "sitemap.xml").getroot()
          links = [n.text for n in sitemap_root.iter() if n.tag.endswith("}loc")]
          assert len(links) == catalog["count"] + 1
          assert all(link.startswith("https://airibeiro.github.io/careersite/discover/") for link in links)
          state = json.loads((agent_dir / "agent/publication-state.json").read_text())
          report = json.loads((agent_dir / "agent/change-report.json").read_text())
          assert set(state["records"]) == {row["slug"] for row in catalog["content"]}
          assert report["status"] in {"bootstrap", "complete", "unavailable"}
          for item in catalog["content"]:
              page = (agent_dir / "discover" / item["slug"] / "index.html").read_text()
              assert item["title"] in page, item["slug"]
              assert "PRIVATE_PREMIUM_COPY" not in page
              assert "content_html" not in page
              assert 'rel="canonical"' in page
          print('Static share pages and metadata-only crawlable discovery validated')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _share_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check out verification code
        uses: actions/checkout@v4
      - name: Set up Python for public verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify live Friday redirects, attribution, and branded OG images
        env:
          PYTHONPATH: src
        run: |
          python scripts/verify_weekly_ai_live_pages.py --latest --briefing-slug 15-ways-ai-can-change-your-business
          python scripts/verify_weekly_ai_live_pages.py --briefing-slug emotional-intelligence-ai-leadership-adoption
      - name: Verify public AI agent discovery files after Pages deployment
        run: python scripts/verify_agent_discovery_live.py
      - name: Notify participating search engines of changed public summaries
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python scripts/indexnow_discovery.py notify --report https://airibeiro.github.io/careersite/agent/change-report.json --key "$INDEXNOW_KEY"
