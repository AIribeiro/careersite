name: Build optimized portfolio photography

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_portfolio_media.py"
      - "src/site_media.py"
      - "src/site_social_preview.py"
      - "images/**"
      - ".github/workflows/build-portfolio-media.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install Pillow
        run: python -m pip install Pillow==12.3.0
      - name: Build optimized image derivatives
        run: python scripts/build_portfolio_media.py
      - name: Build canonical social preview at release time
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from site_social_preview import ensure_social_preview
          from PIL import Image
          path = ensure_social_preview()
          assert path.is_file(), path
          with Image.open(path) as image:
              assert image.size == (1200, 630)
              assert image.format == "PNG"
          print("Built static social preview:", path, path.stat().st_size, "bytes")
          PY
      - name: Commit cacheable WebP assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/optimized
          git add -f static/jair-ribeiro-social-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "build(media): refresh responsive editorial photography"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
