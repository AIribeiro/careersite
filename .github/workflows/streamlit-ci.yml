name: Streamlit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile entry point
        run: python -m py_compile app.py

      - name: Validate embedded site bundle
        shell: python
        run: |
          from pathlib import Path
          import base64
          import io
          import zipfile

          root = Path('.')
          parts = sorted((root / 'payload_parts').glob('part_*.b64'))
          if not parts:
              raise SystemExit('No payload parts found')
          encoded = ''.join(p.read_text(encoding='ascii') for p in parts)
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(encoded))) as bundle:
              names = set(bundle.namelist())
              if 'site.py' not in names:
                  raise SystemExit('site.py missing from embedded bundle')
              source = bundle.read('site.py').decode('utf-8')
              compile(source, 'site.py', 'exec')
              assets = [name for name in names if name.startswith('assets/')]
              if not assets:
                  raise SystemExit('No embedded assets found')
          print(f'Validated {len(parts)} payload parts and {len(assets)} assets')

      - name: Start Streamlit
        run: |
          streamlit run app.py \
            --server.headless true \
            --server.port 8501 \
            > /tmp/streamlit.log 2>&1 &
          echo $! > /tmp/streamlit.pid

      - name: Health check
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "Streamlit health check passed"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/streamlit.log
          exit 1

      - name: Show Streamlit log on failure
        if: failure()
        run: cat /tmp/streamlit.log || true
