name: Media Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Validate persistent leadership photography bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import io
          import zipfile
          from PIL import Image

          parts = sorted(Path("images/site_photos_bundle").glob("part_*.b64"))
          if not parts:
              raise SystemExit("Missing persistent site photo bundle")

          encoded = "".join(path.read_text(encoding="ascii") for path in parts)
          payload = base64.b64decode(encoded)
          required = {
              "hero.avif": (1400, 1050),
              "keynote.avif": (1200, 750),
              "ai-panel.avif": (1400, 875),
              "thinking.avif": (900, 1125),
              "portrait.avif": (720, 720),
          }

          with zipfile.ZipFile(io.BytesIO(payload)) as bundle:
              for name, expected in required.items():
                  data = bundle.read(name)
                  with Image.open(io.BytesIO(data)) as image:
                      image.verify()
                  with Image.open(io.BytesIO(data)) as image:
                      if image.size != expected:
                          raise SystemExit(f"{name}: {image.size}; expected {expected}")
                      print(f"{name}: {image.size[0]}x{image.size[1]} — OK")
          PY
