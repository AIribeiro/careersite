name: Thinking fixed Premium Reader ordering

on:
  pull_request:
    paths:
      - src/thinking_collection_catalogs.py
      - src/thinking_dynamic_order.py
      - src/thinking_landing.py
      - src/thinking_reader_invitation.py
      - tests/test_thinking_collection_catalogs.py
      - tests/test_thinking_premium_reader.py
      - tests/test_thinking_hourly_order.py
      - .github/workflows/thinking-reader-order.yml
  workflow_dispatch:

jobs:
  verify-fixed-reader-section:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile affected files
        run: python -m py_compile src/thinking_collection_catalogs.py src/thinking_dynamic_order.py src/thinking_landing.py src/thinking_reader_invitation.py tests/test_thinking_collection_catalogs.py tests/test_thinking_premium_reader.py
      - name: Verify fixed Premium Reader and unchanged editorial ranking
        run: python -m pytest -q tests/test_thinking_collection_catalogs.py tests/test_thinking_premium_reader.py tests/test_thinking_hourly_order.py
