name: AI Portfolio Scorecard decision contract

on:
  push:
    branches: [main]
    paths:
      - "src/page_advisory_scorecard*.py"
      - "tests/test_advisory_scorecard*.py"
      - "tests/test_advisory_service_feedback.py"
      - "requirements.txt"
      - ".github/workflows/ai-portfolio-scorecard-contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/page_advisory_scorecard*.py"
      - "tests/test_advisory_scorecard*.py"
      - "tests/test_advisory_service_feedback.py"
      - "requirements.txt"
      - ".github/workflows/ai-portfolio-scorecard-contract.yml"

permissions:
  contents: read

jobs:
  verify-executive-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned application requirements
        run: python -m pip install -r requirements.txt
      - name: Compile Scorecard and report modules
        run: python -m py_compile src/page_advisory_scorecard*.py
      - name: Verify Scorecard, advice, ownership and PDF
        run: |
          python -m unittest discover -s tests -p "test_advisory_scorecard*.py" -v
          python -m unittest discover -s tests -p "test_advisory_service_feedback.py" -v
