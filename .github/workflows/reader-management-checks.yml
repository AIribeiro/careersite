name: Reader management and registration analytics
on:
  push:
    branches:
      - feature/reader-management-kpi-20261112
  pull_request:
    paths:
      - src/page_owner_reader_management.py
      - src/page_reader_campaign_drafts.py
      - src/portfolio_reader_kpi.py
      - src/page_reader_native.py
      - src/page_public_portfolio_overview.py
      - src/page_analytics_v2.py
      - tests/test_reader_campaign_and_management.py
      - .github/workflows/reader-management-checks.yml
jobs:
  reader_management:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile reader management modules
        run: |
          python -m compileall -q src/page_owner_reader_management.py src/page_reader_campaign_drafts.py src/portfolio_reader_kpi.py src/page_reader_native.py src/page_analytics_v2.py src/page_public_portfolio_overview.py
      - name: Test consent, security, drafts and period-sensitive reader KPI
        run: python -m unittest discover -s tests -p test_reader_campaign_and_management.py -v
