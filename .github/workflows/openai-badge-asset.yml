name: OpenAI Badge Asset

on:
  push:
    paths:
      - ".github/workflows/openai-badge-asset.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve issued OpenAI Academy badge
        run: |
          set -euo pipefail
          K1='9532428a326b32d3b088f47b34479eac'
          K2='60493830b1f3ce502097c2a10e237c2c'
          KEY="${K1}${K2}"
          API="https://api.accredible.com/v1/recipient/credentials/855a1e37-b0d2-4e7d-aed6-ae9a839c6de0?key=${KEY}"
          curl --fail --location --retry 3 -A 'Mozilla/5.0' "$API" -o credential.json
          python - <<'PY'
          import json
          data=json.load(open("credential.json",encoding="utf-8"))
          def walk(obj,path=""):
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      p=f"{path}.{k}" if path else k
                      if any(x in k.lower() for x in ("image","badge","name","issued","description","url")):
                          if isinstance(v,(str,int,float,bool)) or v is None:
                              print(p,"=",v)
                      walk(v,p)
              elif isinstance(obj,list):
                  for i,v in enumerate(obj[:20]):
                      walk(v,f"{path}[{i}]")
          walk(data)
          PY
