name: Build Site Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_site_images.py"
      - "hq_media.zip"
      - "payload_parts/**"
      - ".github/workflows/build-site-images.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install pillow

      - name: Build curated high-resolution website photography
        run: python scripts/build_site_images.py

      - name: Validate generated images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          required = [
              "hero-executive.webp",
              "impact-keynote.webp",
              "impact-ai-panel.webp",
              "thinking-panel.webp",
              "about-books.webp",
              "about-bw.webp",
              "contact-executive.webp",
              "consulting-panel.webp",
              "enterprise-stage.webp",
          ]
          for name in required:
              path = Path("images") / name
              if not path.exists():
                  raise SystemExit(f"Missing generated image: {path}")
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  w, h = image.size
                  if w * h < 500_000:
                      raise SystemExit(f"Image below quality floor: {name} {w}x{h}")
                  print(f"{name}: {w}x{h} OK")
          PY

      - name: Commit generated /images assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/*.webp
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Build curated high-resolution website photography [skip ci]"
          git push origin HEAD:main
