name: Streamlit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application
        run: python -m py_compile app.py site_*.py page_*.py

      - name: Validate canonical CV binary and public URL
        run: |
          python - <<'PY'
          import site_cv_patch
          import site_delivery_patch
          from pathlib import Path
          from site_assets import CV_BYTES, CV_URI

          target = Path('static/Jair_Ribeiro_Senior_AI_Data_Leader_CV_2026.pdf')
          data = target.read_bytes()
          if not data.startswith(b'%PDF') or len(data) < 4000:
              raise SystemExit('Canonical repository CV is invalid')
          if not CV_BYTES.startswith(b'%PDF'):
              raise SystemExit('Runtime CV bytes are invalid')
          if not CV_URI.startswith('https://raw.githubusercontent.com/AIribeiro/careersite/'):
              raise SystemExit(f'CV URI is not the direct repository URL: {CV_URI}')
          print(f'Validated canonical CV ({len(data)} bytes) at {CV_URI}')
          PY

      - name: Start Streamlit
        run: |
          streamlit run app.py \
            --server.headless true \
            --server.port 8501 \
            > /tmp/streamlit.log 2>&1 &
          echo $! > /tmp/streamlit.pid

      - name: Health check
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "Streamlit health check passed"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/streamlit.log
          exit 1

      - name: Validate public CV bytes from repository CDN
        run: |
          curl --fail --silent "https://raw.githubusercontent.com/AIribeiro/careersite/${GITHUB_SHA}/static/Jair_Ribeiro_Senior_AI_Data_Leader_CV_2026.pdf" -o /tmp/cv.pdf
          test "$(head -c 4 /tmp/cv.pdf)" = "%PDF"
          test "$(wc -c < /tmp/cv.pdf)" -gt 4000
          echo "Public CV binary passed"

      - name: Show Streamlit log on failure
        if: failure()
        run: cat /tmp/streamlit.log || true
