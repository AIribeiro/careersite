.stage-title{font:750 34px Arial,Helvetica,sans-serif;fill:#101a2d}
.stage-detail{font:400 24px Arial,Helvetica,sans-serif;fill:#263542}
.row-num{font:750 34px Arial,Helvetica,sans-serif;fill:#fff}
.row-label{font:750 28px Arial,Helvetica,sans-serif;letter-spacing:-.3px;fill:#0b1730}
.row-desc{font:400 22px Arial,Helvetica,sans-serif;fill:#374251}
.vertical{font:750 22px Arial,Helvetica,sans-serif;fill:#fff}
</style></defs>
