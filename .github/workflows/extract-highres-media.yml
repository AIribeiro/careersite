name: Extract high-resolution media

on:
  push:
    paths:
      - '.github/workflows/extract-highres-media.yml'
      - 'hq_media.zip'
      - 'payload_parts/**'
      - 'asset_parts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install pillow
      - name: Extract only high-resolution source photography
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, io, zipfile, re

          root = Path('.')
          out = root / 'images'
          out.mkdir(exist_ok=True)

          # Keep README but remove previously auto-extracted image files so the source stays deterministic.
          for p in out.iterdir():
              if p.is_file() and p.name.lower() != 'readme.md':
                  p.unlink()

          candidates = {}

          hq = root / 'hq_media.zip'
          if hq.exists():
              with zipfile.ZipFile(hq) as z:
                  for name in z.namelist():
                      if not name.endswith('/'):
                          candidates[Path(name).name] = z.read(name)

          parts = sorted((root / 'payload_parts').glob('part_*.b64'))
          if parts:
              try:
                  encoded = ''.join(p.read_text(encoding='ascii') for p in parts)
                  with zipfile.ZipFile(io.BytesIO(base64.b64decode(encoded))) as z:
                      for name in z.namelist():
                          if name.startswith('assets/') and not name.endswith('/'):
                              candidates.setdefault(Path(name).name, z.read(name))
              except Exception:
                  pass

          panel_parts = sorted((root / 'asset_parts').glob('panel.webp.part*.b64'))
          if panel_parts:
              try:
                  candidates['panel.webp'] = base64.b64decode(''.join(p.read_text(encoding='ascii') for p in panel_parts))
              except Exception:
                  pass

          written = []
          for name, blob in candidates.items():
              try:
                  im = Image.open(io.BytesIO(blob))
                  width, height = im.size
                  # Executive-site photography should remain useful on retina/large displays.
                  if max(width, height) < 1200 or width * height < 1_000_000:
                      continue
                  ext = (im.format or Path(name).suffix.lstrip('.') or 'jpg').lower()
                  ext = {'jpeg':'jpg'}.get(ext, ext)
                  stem = re.sub(r'[^a-z0-9]+', '-', Path(name).stem.lower()).strip('-') or 'photo'
                  dest = out / f'{stem}.{ext}'
                  dest.write_bytes(blob)
                  written.append((dest.name, width, height, len(blob)))
              except Exception:
                  continue

          print('High-resolution media written:')
          for item in written:
              print(item)
          if not written:
              raise SystemExit('No qualifying high-resolution images were extracted')
          PY
      - name: Commit extracted images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images
          if git diff --cached --quiet; then
            echo 'No media changes to commit'
          else
            git commit -m 'Add high-resolution source photography'
            git push origin main
          fi
