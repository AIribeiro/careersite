name: AI Adoption image delivery

on:
  push:
    paths:
      - '.github/workflows/ai-adoption-image-delivery.yml'
      - 'static/briefing-ai-adoption-studio.svg'
      - 'static/briefing-ai-adoption-studio-mobile.svg'
      - 'src/briefing_infographic_store.py'
      - 'src/page_executive_briefings.py'
      - 'tests/test_briefing_adoption_studio.py'
      - '.streamlit/config.toml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and Streamlit dependencies
        run: python -m pip install --disable-pip-version-check 'streamlit==1.64.0' 'CairoSVG==2.8.2' 'Pillow==12.3.0'
      - name: Rasterize approved artwork as supported PNG images
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image, ImageStat
          import cairosvg
          inputs = (
              ('briefing-ai-adoption-studio.svg', 'briefing-ai-adoption-studio.png', (1800,2400)),
              ('briefing-ai-adoption-studio-mobile.svg', 'briefing-ai-adoption-studio-mobile.png', (840,3580)),
          )
          for source, dest, size in inputs:
              src = Path('static') / source
              output = Path('static') / dest
              raster = cairosvg.svg2png(bytestring=src.read_bytes(), output_width=size[0], output_height=size[1])
              image = Image.open(BytesIO(raster)).convert('RGB')
              assert image.size == size, (source,image.size,size)
              pixels = ImageStat.Stat(image)
              assert min(pixels.stddev) > 20, f'Render appears blank: {source}'
              image.save(output, format='PNG', optimize=True)
              assert output.stat().st_size > 15000
              with Image.open(output) as check:
                  check.verify()
              print(f'Validated {dest}: {image.size}, {output.stat().st_size:,} bytes')
          PY
      - name: Verify article image contracts and graphics
        run: python -m unittest discover -s tests -p 'test_briefing_adoption_studio.py' -v
      - name: Start minimal Streamlit server using production static config
        run: |
          printf 'import streamlit as st\nst.title("Native static asset smoke")\n' > _static_image_smoke.py
          python -m streamlit run _static_image_smoke.py --server.headless=true --server.port=8521 > /tmp/ai-adoption-static.log 2>&1 &
      - name: Prove actual HTTP image delivery and raster bytes
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8521/_stcore/health >/dev/null; then
              break
            fi
            sleep 1
          done
          for image in briefing-ai-adoption-studio.png briefing-ai-adoption-studio-mobile.png; do
            url="http://127.0.0.1:8521/app/static/$image"
            code=$(curl -sS -o "/tmp/$image" -w '%{http_code}' "$url")
            test "$code" = 200 || { echo "FAIL: $image returned $code"; exit 1; }
            mimetype=$(curl -sSI "$url" | grep -i '^content-type:' | tr -d '\r' | tr '[:upper:]' '[:lower:]')
            echo "$image: $mimetype"
            echo "$mimetype" | grep -q 'image/png' || exit 1
            python -c 'from PIL import Image; import sys; img=Image.open(sys.argv[1]); img.verify(); print("Verified raster", sys.argv[1])' "/tmp/$image"
          done
      - name: Install browser for real image rendering test
        run: |
          python -m pip install --quiet playwright==1.58.0
          python -m playwright install chromium
      - name: Verify desktop and iPad/mobile image decoding in Streamlit HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          Path("_static_image_smoke.py").write_text(
              'import streamlit as st\n'
              'st.title("Native static asset smoke")\n'
              'st.html("""<picture>'
              '<source media="(max-width:700px)" srcset="/app/static/briefing-ai-adoption-studio-mobile.png"/>'
              '<img id="ai-adoption-test-graphic" src="/app/static/briefing-ai-adoption-studio.png" '
              'alt="AI Adoption" loading="eager" decoding="async" style="display:block;width:100%;max-width:900px;height:auto"/>'
              '</picture>""")\n',
              encoding="utf-8",
          )
          PY
          python -m streamlit run _static_image_smoke.py --server.headless=true --server.port=8522 > /tmp/ai-adoption-browser.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for width, height, expected in [
                  (1100, 860, "briefing-ai-adoption-studio.png"),
                  (390, 844, "briefing-ai-adoption-studio-mobile.png"),
              ]:
                  page = browser.new_page(viewport={"width":width,"height":height})
                  page.goto("http://127.0.0.1:8522/",wait_until="domcontentloaded",timeout=30000)
                  image = page.locator("#ai-adoption-test-graphic")
                  image.wait_for(timeout=25000)
                  page.wait_for_function(
                      '() => { const i=document.getElementById("ai-adoption-test-graphic"); '
                      'return i && i.complete && i.naturalWidth>0 && i.naturalHeight>0; }',
                      timeout=25000,
                  )
                  actual=image.evaluate("(img) => ({width:img.naturalWidth,height:img.naturalHeight,src:img.currentSrc})")
                  assert expected in actual["src"], actual
                  print(f"VISIBLE BROWSER IMAGE {width}px: {actual}",flush=True)
                  page.close()
              browser.close()
          PY
      - name: Commit tested static raster assets
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add static/briefing-ai-adoption-studio.png static/briefing-ai-adoption-studio-mobile.png
          if ! git diff --cached --quiet; then
            git commit -m "Ship verified first-party PNG assets for AI adoption briefing [skip ci]"
            git push origin HEAD:main
          fi
      - name: Show diagnostics on failure
        if: failure()
        run: |
          cat /tmp/ai-adoption-static.log || true
          ls -lah static/briefing-ai-adoption* || true
