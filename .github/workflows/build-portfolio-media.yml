name: Build optimized portfolio photography

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_portfolio_media.py"
      - "src/site_media.py"
      - "images/**"
      - ".github/workflows/build-portfolio-media.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install Pillow
        run: python -m pip install Pillow==12.3.0
      - name: Build optimized image derivatives
        run: python scripts/build_portfolio_media.py
      - name: Commit cacheable WebP assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/optimized
          if ! git diff --cached --quiet; then
            git commit -m "build(media): refresh responsive editorial photography"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
