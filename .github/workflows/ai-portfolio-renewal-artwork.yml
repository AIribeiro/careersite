name: Release AI Portfolio Renewal Challenge artwork
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_renewal_artwork.py.xz.b64'
      - '.github/workflows/ai-portfolio-renewal-artwork.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portfolio-renewal-artwork
  cancel-in-progress: true
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover source-reviewed image generator
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          compressed = Path('scripts/build_renewal_artwork.py.xz.b64').read_text().strip()
          source = lzma.decompress(base64.b64decode(compressed, validate=True))
          expected = '7207f985a60a283be1be147bc73ab13820230e53260b6cee2c6c7d97559b31f0'
          assert hashlib.sha256(source).hexdigest() == expected, 'Image generator source hash mismatch'
          Path('scripts/build_renewal_artwork.py').write_bytes(source)
          print('Source hash verified:', expected)
          PY
      - name: Install current PDF and image dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate source-locked desktop, mobile and A4 artwork
        run: python scripts/build_renewal_artwork.py
      - name: Verify source fingerprint, asset SHA, images and A4 PDF
        env:
          PYTHONPATH: src
        run: |
          python -m unittest -v tests.test_briefing_approved_asset_renderer tests.test_briefing_renewal_worksheet
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from pypdf import PdfReader
          from briefing_approved_asset_renderer import load_bundle, validate_bundle
          slug = 'would-you-fund-the-same-ai-initiatives-today'
          b = load_bundle(slug, asset_root=Path('static/briefing-artwork'),
                          expected_fingerprint='b9e255ca0e7ac9fdf7504e98fe07dd9e8f642c96c4e492d6aac4adf511c27bd5')
          assert b is not None
          desktop, mobile, pdf_bytes = validate_bundle(b)
          assert len(desktop) > 1000 and len(mobile) > 1000 and len(pdf_bytes) > 1000
          for variant in ('desktop', 'mobile'):
              p = Path('static/briefing-artwork') / slug / b[variant]['file']
              with Image.open(p) as im:
                  assert im.format == 'WEBP'
                  assert im.size == (b[variant]['width'], b[variant]['height'])
                  im.verify()
          with (Path('static/briefing-artwork') / slug / 'infographic.pdf').open('rb') as fh:
              pdf = PdfReader(fh, strict=True)
              assert len(pdf.pages) == b['pdf']['pages'] == 1
              assert 589 < float(pdf.pages[0].mediabox.width) < 601
              assert 836 < float(pdf.pages[0].mediabox.height) < 849
          print('PASS: exact CMS fingerprint, SHA-verified WebP, A4 PDF, protected worksheet checks')
          PY
      - name: Commit approved-ready artifact bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_renewal_artwork.py static/briefing-artwork/would-you-fund-the-same-ai-initiatives-today/
          if ! git diff --cached --quiet; then
            git commit -m "Package AI Portfolio Renewal Challenge visual and A4 release"
            for attempt in 1 2 3 4; do
              git pull --rebase origin main || exit 1
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
