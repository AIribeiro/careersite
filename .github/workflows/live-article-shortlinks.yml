name: Verify live article short links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-article-shortlinks.yml'
  workflow_run:
    workflows: ["Social Share Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser-check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install headless browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Check live Streamlit article navigation and tracking
        run: |
          python - <<'PY'
          import os
          import time
          from urllib.parse import parse_qs, urlparse
          from playwright.sync_api import sync_playwright

          base = "https://jairribeiro-ai.streamlit.app"
          short_base = "https://airibeiro.github.io/careersite/go"
          title = "If AI Does the Routine Work, How Will We Develop the Next Experts?"
          slug = "if-ai-does-the-routine-work-how-will-we-develop-the-next-experts"
          channels = [
              ("el", "linkedin", "social"),
              ("ex", "x", "social"),
              ("et", "threads", "social"),
              ("ef", "facebook", "social"),
              ("ew", "whatsapp", "messaging"),
          ]
          os.makedirs("live-link-diagnostics", exist_ok=True)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--no-sandbox"])
              try:
                  # Compare the underlying article directly, before testing the alias.
                  direct = browser.new_page(viewport={"width": 1400, "height": 900})
                  try:
                      direct_url = f"{base}/?page=thinking&article={slug}"
                      direct_response = direct.goto(
                          direct_url, wait_until="domcontentloaded", timeout=90000
                      )
                      direct.wait_for_timeout(15000)
                      print(f"DIRECT article HTTP: {direct_response.status if direct_response else 'none'}", flush=True)
                      print(f"DIRECT browser URL: {direct.url}", flush=True)
                      print(f"DIRECT page title: {direct.title()}", flush=True)
                      print(f"DIRECT body sample: {direct.locator('body').inner_text(timeout=10000)[:1800]!r}", flush=True)
                      print(f"DIRECT frames: {[frame.url for frame in direct.frames]}", flush=True)
                      active = next((frame for frame in direct.frames if "/~/+/" in frame.url), None)
                      if active:
                          print(f"DIRECT app body: {active.locator('body').inner_text(timeout=10000)[:2000]!r}", flush=True)
                          print(f"DIRECT app title: {active.title()}", flush=True)
                      direct.screenshot(
                          path="live-link-diagnostics/direct-article.png",
                          full_page=False,
                          timeout=10000,
                      )
                  except Exception as exc:
                      print(f"DIRECT article preflight failed: {type(exc).__name__}: {exc}", flush=True)
                  finally:
                      direct.close()
                  for code, channel, medium in channels:
                      success = False
                      for attempt in range(1, 3):
                          page = browser.new_page(
                              viewport={"width": 1400, "height": 900}
                          )
                          try:
                              print(f"Checking {short_base}/{code}/; attempt {attempt}", flush=True)
                              response = page.goto(
                                  f"{short_base}/{code}/",
                                  wait_until="domcontentloaded",
                                  timeout=90000,
                              )
                              assert response is not None and response.status == 200, (
                                  f"Unexpected HTTP status: {response.status if response else 'none'}"
                              )
                              # Streamlit Community Cloud wraps the real app
                              # in /~/+/; the outer frame's query never changes.
                              page.wait_for_timeout(9000)
                              frame = next(
                                  (f for f in page.frames if "/~/+/" in f.url),
                                  None,
                              )
                              assert frame is not None, "Streamlit application iframe absent"
                              print(f"App frame URL before assertions: {frame.url}", flush=True)
                              print(f"App frame text: {frame.locator('body').inner_text(timeout=10000)[:1400]!r}", flush=True)
                              frame.wait_for_function(
                                  """expected => {
                                      const p = new URLSearchParams(window.location.search);
                                      return p.get('page') === 'thinking'
                                          && p.get('article') === expected.slug
                                          && p.get('source') === expected.channel
                                          && p.get('utm_source') === expected.channel
                                          && p.get('utm_medium') === expected.medium
                                          && p.get('utm_campaign') === 'thinking'
                                          && p.get('utm_content') === expected.slug
                                          && p.get('role') === 'article';
                                  }""",
                                  arg={"slug": slug, "channel": channel, "medium": medium},
                                  timeout=35000,
                              )
                              frame.get_by_text(title, exact=False).first.wait_for(
                                  state="visible", timeout=70000
                              )
                              print(
                                  f"PASS {code} {channel}: app URL={frame.url}; "
                                  f"visible article title confirmed",
                                  flush=True,
                              )
                              success = True
                              break
                          except Exception as exc:
                              print(
                                  f"FAIL {code} {channel} attempt {attempt}: "
                                  f"{type(exc).__name__}: {str(exc)[:1000]}",
                                  flush=True,
                              )
                              print(f"Current browser URL: {page.url}", flush=True)
                              try:
                                  print(f"Page title: {page.title()}", flush=True)
                                  print(f"Body sample: {page.locator('body').inner_text(timeout=10000)[:1800]!r}", flush=True)
                                  print(f"Frame URLs: {[frame.url for frame in page.frames]}", flush=True)
                                  app_frame = next((f for f in page.frames if "/~/+/" in f.url), None)
                                  if app_frame:
                                      print(f"App frame text after failure: {app_frame.locator('body').inner_text(timeout=10000)[:2000]!r}", flush=True)
                                      print(f"App frame title after failure: {app_frame.title()}", flush=True)
                              except Exception as diagnosis:
                                  print(f"Browser diagnostics error: {diagnosis}", flush=True)
                              try:
                                  page.screenshot(
                                      path=f"live-link-diagnostics/{code}-attempt-{attempt}.png",
                                      full_page=False,
                                      timeout=10000,
                                  )
                              except Exception:
                                  pass
                              if attempt == 2:
                                  raise
                              time.sleep(8)
                          finally:
                              page.close()
                      assert success
              finally:
                  browser.close()
          PY

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-shortlink-diagnostics
          path: live-link-diagnostics/
          if-no-files-found: ignore


  friday-live-redirects:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify current Friday live aliases, article destination, and audio endpoint
        run: |
          python - <<'PY'
          import html
          import time
          from datetime import datetime, timedelta
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo('Europe/Stockholm')).date()
          friday = today - timedelta(days=(today.weekday() - 4) % 7)
          iso_year, iso_week, _ = friday.isocalendar()
          slug = 'weekly-ai-' + friday.isoformat()
          campaign = f'weekly_ai_{iso_year}_w{iso_week}_friday'
          prefix = f'f{iso_year}{iso_week:02d}'
          base = 'https://airibeiro.github.io/careersite/go'
          for suffix, channel in (('x', 'x'), ('t', 'threads'), ('l', 'linkedin')):
              alias = f'{base}/{prefix}{suffix}/'
              last_error = None
              for attempt in range(6):
                  try:
                      req = Request(alias, headers={'User-Agent': 'Weekly-AI-Live-Release-Check/1.0'})
                      with urlopen(req, timeout=25) as response:
                          body = html.unescape(response.read().decode('utf-8'))
                          assert response.status == 200, f'HTTP {response.status}'
                      for required in (slug, 'page=thinking', 'article=' + slug,
                                       'utm_campaign=' + campaign, 'utm_content=weekly_perspective',
                                       'utm_source=' + channel, 'role=weeklyai',
                                       'window.location.replace'):
                          assert required in body, f'Missing {required}'
                      print(f'LIVE PASS {channel}: {alias}', flush=True)
                      break
                  except Exception as exc:
                      last_error = exc
                      print(f'RETRY {channel} {attempt+1}: {exc}', flush=True)
                      if attempt < 5: time.sleep(12)
              else:
                  raise AssertionError(f'Live Friday alias unavailable: {alias}: {last_error}')

          article = f'https://jairribeiro-ai.streamlit.app/?page=thinking&article={slug}'
          with urlopen(Request(article, headers={'User-Agent':'Weekly-AI-Live-Release-Check/1.0'}), timeout=45) as r:
              assert r.status == 200, f'Public article route HTTP {r.status}'
          print(f'ARTICLE ROUTE PASS: {article}', flush=True)

          audio = f'https://jairribeiro-ai.streamlit.app/weekly-ai-audio/{slug}.mp3'
          req = Request(audio, headers={'Range':'bytes=0-1023','User-Agent':'Weekly-AI-Live-Release-Check/1.0'})
          with urlopen(req, timeout=45) as r:
              sample = r.read(1024)
              mime = r.headers.get('Content-Type', '').split(';')[0].strip()
              assert r.status in (200, 206), f'Audio route HTTP {r.status}'
              assert mime == 'audio/mpeg', f'Audio MIME {mime}'
              assert sample.startswith(b'ID3') or sample.startswith(b'\\xff\\xfb'), 'Invalid MP3 header'
              if r.status == 206:
                  assert r.headers.get('Content-Range','').startswith('bytes 0-'), 'Invalid byte range'
          print(f'AUDIO ROUTE PASS: {audio}', flush=True)
          PY
