name: Market Signals approved video release QA

on:
  push:
    paths:
      - ".github/workflows/market-signals-video-release-qa.yml"
      - "src/page_advisory_market_signals.py"
      - "static/market-signals/video-unionen-2026-11/manifest.json"
      - "tests/test_market_signals_video_release.py"
      - "tests/test_market_signals_landing.py"
  workflow_dispatch:

permissions: { contents: read }

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install site and browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt 'playwright==1.58.0'
          python -m playwright install chromium
      - name: Validate publication, member links and preserved historical film
        run: |
          python -m unittest discover -s tests -p test_market_signals_video_release.py -v
          python -m unittest discover -s tests -p test_market_signals_landing.py -v
      - name: Validate exact CDN media hashes and HTTP Range
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,urllib.request
          m=json.loads(pathlib.Path('static/market-signals/video-unionen-2026-11/manifest.json').read_text())
          for kind in ('web','poster'):
              asset=m[kind]
              url=asset['public_url']
              req=urllib.request.Request(url,method='HEAD')
              with urllib.request.urlopen(req,timeout=30) as r:
                  assert r.status==200,(kind,r.status)
                  assert r.headers.get('Content-Type','').split(';')[0] == ('video/mp4' if kind=='web' else 'image/jpeg')
                  assert int(r.headers['Content-Length'])==asset['bytes']
              with urllib.request.urlopen(url,timeout=60) as r:
                  b=r.read()
              assert len(b)==asset['bytes']
              assert hashlib.sha256(b).hexdigest()==asset['sha256']
              if kind=='web':
                  assert b[4:8]==b'ftyp'
                  size=len(b)
                  for start in (0,size//2,size-1024):
                      end=min(start+1023,size-1)
                      req=urllib.request.Request(url,headers={'Range':f'bytes={start}-{end}'})
                      with urllib.request.urlopen(req,timeout=30) as r:
                          assert r.status==206,(start,r.status)
                          assert r.headers['Content-Range']==f'bytes {start}-{end}/{size}'
                          assert r.read()==b[start:end+1]
              print('MEDIA VERIFY',kind,'200',asset['bytes'],'SHA256 PASS',flush=True)
          print('ANONYMOUS MP4 START/MIDDLE/END 206 PASS',flush=True)
          PY
      - name: Verify in-browser metadata, play and seek from public MP4
        run: |
          python - <<'PY'
          import json,pathlib,sys
          from playwright.sync_api import sync_playwright
          sys.path.insert(0,'src')
          from page_advisory_market_signals import MARKET_SIGNALS_LANDING_HTML,MARKET_SIGNALS_LANDING_CSS
          html=MARKET_SIGNALS_LANDING_HTML
          a=html.index('<section class="ms-section ms-section--video"')
          b=html.index('</section>',a)+10
          frag=html[a:b]
          page_html='<html><head><meta name="viewport" content="width=device-width, initial-scale=1">'+MARKET_SIGNALS_LANDING_CSS+'</head><body><main class="site ms-landing">'+frag+'</main></body></html>'
          pathlib.Path('/tmp/market-release-video.html').write_text(page_html)
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--autoplay-policy=no-user-gesture-required'])
              for width,height in ((1440,900),(390,844)):
                  page=browser.new_page(viewport={'width':width,'height':height})
                  page.goto(pathlib.Path('/tmp/market-release-video.html').as_uri())
                  page.locator('video').wait_for()
                  page.wait_for_function("document.querySelector('video').readyState>=1", timeout=35000)
                  meta=page.locator('video').evaluate("(v)=>({duration:v.duration,width:v.videoWidth,height:v.videoHeight,source:v.currentSrc,ready:v.readyState})")
                  assert abs(meta['duration']-95.867)<0.3,meta
                  assert (meta['width'],meta['height'])==(1920,1080),meta
                  page.locator('video').evaluate("(v)=>v.play()")
                  page.wait_for_function("document.querySelector('video').currentTime>0.05", timeout=15000)
                  page.locator('video').evaluate("(v)=>{v.currentTime=48;}")
                  page.wait_for_function("document.querySelector('video').currentTime>=47.5", timeout=15000)
                  view=page.evaluate("({screen:innerWidth,scroll:document.documentElement.scrollWidth})")
                  assert view['scroll']<=width+2,view
                  print('BROWSER VIDEO PASS',width,'duration',round(meta['duration'],3),'play and seek passed',flush=True)
                  page.close()
              browser.close()
          PY

      - name: Verify player in deployed public Streamlit page
        continue-on-error: true
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright
          url='https://jairribeiro-ai.streamlit.app/?page=advisory-market-signals&source=internal_qa&role=video_release'
          expected='https://rnqweoxtynelfirffmlr.supabase.co/storage/v1/object/public/portfolio-public-videos/market-signals/unionen-2026-11/website-eafa2f511a32.mp4'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--autoplay-policy=no-user-gesture-required'])
              page=browser.new_page(viewport={'width':1440,'height':900})
              page.goto(url,wait_until='domcontentloaded',timeout=60000)
              ready=False
              for n in range(20):
                  if page.locator('#ms-video .ms-video-player').count():
                      ready=True
                      break
                  print('Live site loading attempt',n+1,'URL',page.url,flush=True)
                  time.sleep(3)
              page.screenshot(path='/tmp/market-signals-live.png',full_page=True)
              if not ready:
                  print('LIVE PAGE URL:',page.url,flush=True)
                  print('LIVE PAGE TITLE:',page.title(),flush=True)
                  print('VISIBLE BODY:',repr(page.locator('body').inner_text(timeout=8000)[:1400]),flush=True)
                  print('FRAMES:',len(page.frames),flush=True)
                  raise AssertionError('Live Streamlit page did not show the Market Signals video player')
              el=page.locator('#ms-video .ms-video-player').first
              actual=el.locator('source').get_attribute('src')
              assert actual==expected,(actual,expected)
              page.wait_for_function("document.querySelector('#ms-video video').readyState>=1",timeout=35000)
              meta=el.evaluate("(v)=>({duration:v.duration,width:v.videoWidth,height:v.videoHeight})")
              assert abs(meta['duration']-95.867)<0.3,meta
              assert (meta['width'],meta['height'])==(1920,1080),meta
              el.evaluate("(v)=>v.play()")
              page.wait_for_function("document.querySelector('#ms-video video').currentTime>0.05",timeout=15000)
              el.evaluate("(v)=>{v.currentTime=48}")
              page.wait_for_function("document.querySelector('#ms-video video').currentTime>=47.5",timeout=15000)
              print('LIVE STREAMLIT PLAYER VERIFIED, source, play and seek:',page.url,flush=True)
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-signals-video-live-screen
          path: /tmp/market-signals-live.png
          if-no-files-found: ignore
          retention-days: 7
