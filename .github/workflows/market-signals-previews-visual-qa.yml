name: Market Signals PDF preview visual QA

on:
  push:
    paths:
      - '.github/workflows/market-signals-previews-visual-qa.yml'
      - 'src/page_advisory_market_signals.py'
      - 'static/market-signals/previews/**'
      - 'tests/test_market_signals_pdf_previews.py'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt 'playwright==1.58.0'
          python -m playwright install chromium
      - name: Check provenance, labels and image integrity
        run: python -m unittest discover -s tests -p 'test_market_signals_pdf_previews.py' -v
      - name: Open the actual gallery DOM with local copies of the four captured pages
        run: |
          python - <<'PY'
          import base64,sys
          from pathlib import Path
          root=Path.cwd()
          sys.path.insert(0,str(root/"src"))
          from page_advisory_market_signals import MARKET_SIGNALS_LANDING_HTML,MARKET_SIGNALS_LANDING_CSS
          html=MARKET_SIGNALS_LANDING_HTML
          start=html.index('<section class="ms-section ms-section--white ms-section--previews"')
          end=html.index('<section class="ms-section ms-section--white" id="ms-careers"',start)
          gallery=html[start:end]
          assets=root/"static/market-signals/previews/unionen-2026-11"
          for path in assets.glob("*.png"):
              uri="data:image/png;base64,"+base64.b64encode(path.read_bytes()).decode()
              from_url="https://cdn.jsdelivr.net/gh/AIribeiro/careersite@e60b44bdb055d703960043b7b7c00f0408ef54fa/"+path.relative_to(root).as_posix()
              gallery=gallery.replace(from_url,uri)
          assert gallery.count("data:image/png;base64,")==8,"Every click-through and image must resolve"
          page='<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
          page+=MARKET_SIGNALS_LANDING_CSS+'</head><body style="margin:0">'
          page+='<main class="site ms-landing advisory-page">'+gallery+'</main></body></html>'
          Path("/tmp/market-previews-qa.html").write_text(page,encoding="utf-8")
          print("Gallery fixture assembled from production HTML and original full-page PNGs")
          PY
      - name: Verify responsive composition in Chromium
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for width,height in ((1440,900),(1024,800),(390,844)):
                  page=browser.new_page(viewport={"width":width,"height":height},device_scale_factor=1)
                  page.goto(Path("/tmp/market-previews-qa.html").as_uri())
                  page.locator('.ms-preview-page img').first.wait_for()
                  page.wait_for_function("Array.from(document.querySelectorAll('.ms-preview-page img')).length===4 && Array.from(document.querySelectorAll('.ms-preview-page img')).every(x=>x.complete&&x.naturalWidth===1102&&x.naturalHeight===1558)")
                  sizes=page.evaluate("({viewport:innerWidth,document:document.documentElement.scrollWidth,images:Array.from(document.querySelectorAll('.ms-preview-page img')).map(x=>({w:x.getBoundingClientRect().width,h:x.getBoundingClientRect().height}))})")
                  assert sizes["document"] <= width+2, (width,sizes)
                  assert all(x["w"]>180 and x["h"]>250 for x in sizes["images"]),(width,sizes)
                  for selector in ('.ms-preview-copy', '.ms-preview-page'):
                      boxes=page.locator(selector).all()
                      assert len(boxes) in (2,4)
                      for box in boxes:
                          bb=box.bounding_box()
                          assert bb is not None and bb["x"]>=-2 and bb["x"]+bb["width"]<=width+3,(width,bb)
                  out=f"/tmp/market-previews-{width}.png"
                  page.screenshot(path=out,full_page=True)
                  print("BROWSER PASS",width,"px",sizes,"screenshot",out)
                  page.close()
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-signals-preview-visual-qa
          path: /tmp/market-previews-*.png
          retention-days: 7
