name: Reader management and public registration KPI
on:
  push:
    branches:
      - feature/reader-management-kpi-20261112
  pull_request:
    paths:
      - src/page_owner_reader_management.py
      - src/portfolio_reader_kpi.py
      - src/page_public_portfolio_overview.py
      - src/page_analytics_v2.py
      - src/page_reader_native.py
      - tests/test_reader_management.py
      - .github/workflows/reader-management.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax and reader management contracts
        run: |
          python -m compileall -q src/page_owner_reader_management.py src/portfolio_reader_kpi.py src/page_public_portfolio_overview.py src/page_analytics_v2.py src/page_reader_native.py
          python -m unittest discover -s tests -p test_reader_management.py -v
      - name: Regress reader library and public preview
        run: |
          python -m unittest discover -s tests -p test_reader_membership.py -v
          python -m unittest discover -s tests -p test_reader_library_membership.py -v
          python -m unittest discover -s tests -p test_briefing_public_preview.py -v
