name: P0 production browser smoke check
on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "app.py"
      - "src/**"
      - "images/**"
      - "static/**"
      - ".github/workflows/p0-production-health.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser:
    # Playwright Chromium 1.58 does not support the Ubuntu 26.04 runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless Chromium
        run: |
          python -m pip install --quiet playwright==1.58.0
          python -m playwright install chromium
      - name: Open public portfolio as a real browser
        env:
          SITE_URL: https://jairribeiro-ai.streamlit.app/
        run: |
          python - <<'PY'
          import os
          import time
          from urllib.parse import urlsplit

          def qa_url(url):
              # Keep full production smoke coverage without counting test runs as readers.
              # The analytics collector retains events; reporting filters this explicit QA cohort.
              return url + ("&" if "?" in url else "?") + "source=internal_qa&role=smoke"
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 900})
              try:
                  page.goto(qa_url(os.environ["SITE_URL"]), wait_until="domcontentloaded", timeout=45000)
              except Exception as exc:
                  print(f"Initial navigation warning: {type(exc).__name__}: {str(exc)[:200]}")
              visible = False
              for i in range(12):
                  try:
                      url = urlsplit(page.url)
                      print(f"Browser attempt {i+1}: host={url.netloc} path={url.path}")
                      if page.locator(".site .hero h1").count() > 0:
                          heading = page.locator(".site .hero h1").first.inner_text(timeout=5000)
                          if "Jair Ribeiro" in heading:
                              print(f"PUBLIC PORTFOLIO IS AVAILABLE: {heading[:100]}")
                              visible = True
                              break
                      text = page.locator("body").inner_text(timeout=8000)[:350]
                      print(f"Visible text: {text!r}")
                  except Exception as exc:
                      print(f"Page still loading: {type(exc).__name__}: {str(exc)[:200]}")
                  time.sleep(5)
              failed = []
              if not visible:
                  failed.append("Portfolio homepage did not render in the browser smoke check")
                  print("WARNING: Homepage unavailable; continue to independently test individual routes", flush=True)

              # Warm browser navigation across every major public route,
              # including a CMS-backed reader. Measure the visible page rather
              # than relying on the HTTP 200 returned by Streamlit's shell.
              routes = [
                  ("AI Leadership", "?page=impact", ".site main"),
                  ("Thinking", "?page=thinking", ".site main"),
                  ("Executive Briefings", "?page=briefings", ".site .briefings-library-hero"),
                  ("Executive Briefing reader", "?page=briefing&article=eu-ai-act-what-executives-must-decide", ".site .briefing-reader"),
                  ("AI and Data Governance", "?page=ai-data-governance", ".site main"),
                  ("About", "?page=about", ".site main"),
                  ("Contact", "?page=contact", ".site main"),
                  ("Advisory", "?page=advisory", ".site .advisory-page"),
                  ("Advisory account", "?page=advisory-access", ".site.native-shell-header .native-hero"),
                  ("Reader library", "?page=readers", ".site.reader-shell .reader-hero"),
                  ("Portfolio intelligence", "?page=analytics", ".site.native-shell-header .native-hero"),
                  ("Privacy", "?page=privacy", ".site .privacy-page"),
              ]
              timings = []
              base = os.environ["SITE_URL"].rstrip("/") + "/"
              for label, query, selector in routes:
                  started = time.monotonic()
                  try:
                      page.goto(qa_url(base + query), wait_until="domcontentloaded", timeout=30000)
                      page.wait_for_selector(selector, state="attached", timeout=30000)
                      if label in ("Advisory account", "Portfolio intelligence"):
                          page.wait_for_selector(
                              ".site.native-shell-header nav.nav, .site.native-shell-footer footer.footer",
                              state="attached", timeout=30000,
                          )
                          if page.locator(".site.native-shell-header nav.nav").count() != 1:
                              raise RuntimeError("Portfolio top navigation missing on native page")
                          page.wait_for_selector(
                              ".site.native-shell-footer footer.footer",
                              state="attached", timeout=30000,
                          )
                      elapsed = round((time.monotonic() - started) * 1000)
                      timings.append((label, elapsed))
                      print(f"PUBLIC PAGE {label}: content visible after {elapsed} ms", flush=True)
                  except Exception as exc:
                      failed.append(f"{label}: {type(exc).__name__}: {str(exc)[:150]}")
              # Check the exact briefing artwork, not merely the presence of its page.
              # A CMS approval or a Git commit cannot substitute for a rendered image.
              roi_issue = "ai-roi-what-executives-must-prove-before-scaling"
              roi_error = None
              for attempt in range(4):
                  try:
                      page.goto(qa_url(base + "?page=briefing&article=" + roi_issue),
                                wait_until="domcontentloaded", timeout=30000)
                      page.wait_for_selector(".site .cms-roi-inline-visual img, .site .roi-artwork-figure img",
                                             state="attached", timeout=12000)
                      page.wait_for_function(
                          "() => { const im = document.querySelector('.site .cms-roi-inline-visual img, .site .roi-artwork-figure img'); "
                          "return !!(im && im.complete && im.naturalWidth >= 1200 && im.naturalHeight >= 1600); }",
                          timeout=12000,
                      )
                      download = page.locator(".site .cms-roi-inline-visual .cms-roi-download, .site .roi-artwork-actions a")
                      if download.count() != 1 or download.first.get_attribute("href") != "/briefing-ai-roi/infographic.pdf":
                          raise RuntimeError("AI ROI PDF download CTA is absent or points to the wrong asset")
                      response = page.request.get(base + "briefing-ai-roi/infographic.png", timeout=20000)
                      if response.status != 200 or "application/pdf" not in response.headers.get("content-type", ""):
                          raise RuntimeError(f"PNG download returned HTTP {response.status}, not application/pdf")
                      if not response.body().startswith(b"%PDF-"):
                          raise RuntimeError("PDF download response did not contain a valid PDF signature")
                      print("PUBLIC AI ROI: full infographic visible and A4 PDF download working", flush=True)
                      roi_error = None
                      break
                  except Exception as exc:
                      roi_error = f"{type(exc).__name__}: {str(exc)[:200]}"
                      print(f"AI ROI browser check {attempt+1}/4: {roi_error}", flush=True)
                      if attempt < 3:
                          time.sleep(8)
              if roi_error:
                  failed.append("AI ROI infographic: " + roi_error)
              # The hero is the first meaningful photo on Home. Avoid silently
              # accepting a missing asset as a passing page smoke test.
              try:
                  page.goto(qa_url(base), wait_until="domcontentloaded", timeout=30000)
                  page.wait_for_selector(".site .portrait img", timeout=30000)
                  page.wait_for_function(
                      "() => { const image = document.querySelector('.site .portrait img'); "
                      "return !!(image && image.complete && image.naturalWidth > 0); }",
                      timeout=15000,
                  )
                  print("PUBLIC IMAGE: Home hero loaded", flush=True)
              except Exception as exc:
                  failed.append(f"Home hero image: {type(exc).__name__}: {str(exc)[:150]}")
              browser.close()
              for label, elapsed in timings:
                  if elapsed > 6000:
                      print(f"PERFORMANCE WARNING: {label} visible-content time {elapsed} ms exceeds 6000 ms", flush=True)
              if failed:
                  raise SystemExit("Live browser smoke failed: " + "; ".join(failed))
          PY
