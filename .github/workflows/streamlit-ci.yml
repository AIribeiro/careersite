name: Streamlit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application
        run: python -m py_compile app.py main.py src/*.py scripts/*.py tests/*.py

      - name: Build and validate Thinking publication assets
        run: python scripts/build_thinking_assets.py --check

      - name: Run smoke tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Start Streamlit
        run: |
          streamlit run app.py \
            --server.headless true \
            --server.port 8501 \
            > /tmp/streamlit.log 2>&1 &
          echo $! > /tmp/streamlit.pid

      - name: Health check
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "Streamlit health check passed"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/streamlit.log
          exit 1

      - name: Verify Weekly AI MP3 playback endpoint and byte-range support
        run: |
          AUDIO_URL="http://127.0.0.1:8501/weekly-ai-audio/weekly-ai-2026-10-11.mp3"
          curl --fail --silent --show-error --dump-header /tmp/weekly-ai-headers.txt \
            --output /tmp/weekly-ai-served.mp3 "$AUDIO_URL"
          grep -i '^content-type:.*audio/mpeg' /tmp/weekly-ai-headers.txt
          python - <<'PY'
          from pathlib import Path
          received=Path('/tmp/weekly-ai-served.mp3').read_bytes()
          expected=Path('static/weekly-ai/weekly-ai-2026-10-11.mp3').read_bytes()
          assert received == expected, "The website did not serve the original MP3 bytes"
          assert len(received) > 10000
          print(f'Audio endpoint correctly served {len(received)} MP3 bytes')
          PY

          curl --fail --silent --show-error --dump-header /tmp/weekly-ai-range-headers.txt \
            --header 'Range: bytes=0-4095' --output /tmp/weekly-ai-partial.mp3 "$AUDIO_URL"
          grep -E '^HTTP/.* 206' /tmp/weekly-ai-range-headers.txt
          grep -i '^content-range:.*bytes 0-4095/' /tmp/weekly-ai-range-headers.txt
          python - <<'PY'
          from pathlib import Path
          received=Path('/tmp/weekly-ai-partial.mp3').read_bytes()
          expected=Path('static/weekly-ai/weekly-ai-2026-10-11.mp3').read_bytes()
          assert len(received)==4096, len(received)
          assert received==expected[:4096], "Incorrect media bytes in Safari range request"
          print('Mobile range request passed')
          PY

      - name: Verify owner login and refresh routes are mounted
        run: |
          curl --fail --silent --show-error \
            --dump-header /tmp/owner-login-headers.txt \
            --output /tmp/owner-login.html \
            "http://127.0.0.1:8501/owner-auth/login?next=analytics"
          grep 'Portfolio owner sign-in' /tmp/owner-login.html
          grep -i '^cache-control:.*no-store' /tmp/owner-login-headers.txt
          curl --silent --show-error --dump-header /tmp/owner-refresh-headers.txt \
            --output /dev/null \
            "http://127.0.0.1:8501/owner-auth/refresh?next=analytics"
          grep -E '^HTTP/.* 303' /tmp/owner-refresh-headers.txt
          grep -i '^location:.*owner-auth/login' /tmp/owner-refresh-headers.txt
          curl --silent --show-error --dump-header /tmp/owner-forbidden-headers.txt \
            --output /dev/null \
            --request POST --header 'Origin: https://attacker.invalid' \
            "http://127.0.0.1:8501/owner-auth/logout"
          grep -E '^HTTP/.* 403' /tmp/owner-forbidden-headers.txt

      - name: Verify tagged article permalink redirects immediately
        run: |
          SLUG="ai-is-turning-data-definitions-into-a-leadership-problem"
          curl --silent --show-error --max-time 10 \
            --dump-header /tmp/article-redirect-headers.txt --output /dev/null \
            "http://127.0.0.1:8501/thinking/${SLUG}?source=linkedin&utm_source=linkedin&utm_medium=social&utm_campaign=thinking&utm_content=${SLUG}"
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import parse_qs, urlparse

          raw = Path("/tmp/article-redirect-headers.txt").read_text()
          assert " 302 " in raw, raw
          location = next(line.split(":", 1)[1].strip() for line in raw.splitlines()
                          if line.lower().startswith("location:"))
          target = urlparse(location)
          params = parse_qs(target.query)
          assert target.path == "/", location
          assert params["page"] == ["thinking"]
          assert params["article"] == ["ai-is-turning-data-definitions-into-a-leadership-problem"]
          assert params["source"] == ["linkedin"]
          assert params["utm_source"] == ["linkedin"]
          assert params["utm_medium"] == ["social"]
          assert params["utm_campaign"] == ["thinking"]
          print("Tagged article URL redirects to the native Streamlit reader without CMS lookup.")
          PY

      - name: Verify public CV endpoint serves PDF bytes
        run: |
          CV="Jair_Ribeiro_CV.pdf"
          curl --fail --silent --show-error \
            --dump-header /tmp/cv-headers.txt \
            --output /tmp/downloaded-cv.pdf \
            "http://127.0.0.1:8501/app/static/${CV}"

          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from pypdf import PdfReader

          served = Path('/tmp/downloaded-cv.pdf').read_bytes()
          committed = Path('static/Jair_Ribeiro_CV.pdf').read_bytes()

          assert served.startswith(b'%PDF-'), f'HTTP endpoint returned non-PDF bytes: {served[:32]!r}'
          assert served.rstrip().endswith(b'%%EOF'), 'Served PDF is missing EOF marker'
          assert served == committed, 'Served CV bytes differ from committed canonical PDF'
          reader = PdfReader(BytesIO(served), strict=True)
          assert len(reader.pages) >= 1, 'Served CV has no pages'
          assert reader.trailer.get('/Root') is not None, 'Served CV catalog missing'
          print(f'CV endpoint validated: {len(served)} bytes, {len(reader.pages)} pages')
          PY

          grep -i '^Content-Type:.*application/pdf' /tmp/cv-headers.txt

      - name: Verify social preview endpoint serves branded PNG
        run: |
          PREVIEW="jair-ribeiro-social-preview.png"
          curl --fail --silent --show-error \
            --dump-header /tmp/social-headers.txt \
            --output /tmp/social-preview.png \
            "http://127.0.0.1:8501/app/static/${PREVIEW}"

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          path = Path('/tmp/social-preview.png')
          served = path.read_bytes()
          assert served.startswith(b'\x89PNG\r\n\x1a\n'), f'HTTP endpoint returned non-PNG bytes: {served[:32]!r}'
          with Image.open(path) as image:
              assert image.format == 'PNG', f'Expected PNG, got {image.format}'
              assert image.size == (1200, 630), f'Unexpected social preview size: {image.size}'
          print(f'Social preview endpoint validated: {len(served)} bytes, 1200x630 PNG')
          PY

          grep -i '^Content-Type:.*image/png' /tmp/social-headers.txt

      - name: Verify governance social share route
        run: |
          curl --fail --silent --show-error \
            --user-agent "Twitterbot/1.0" \
            --output /tmp/governance-share.html \
            "http://127.0.0.1:8501/ai-data-governance?utm_source=x"
          grep 'name="twitter:card" content="summary_large_image"' /tmp/governance-share.html
          grep 'property="og:title"' /tmp/governance-share.html
          grep 'property="og:image"' /tmp/governance-share.html
          grep 'AI &amp; Data Governance' /tmp/governance-share.html

          curl --silent --show-error --head \
            --user-agent "Mozilla/5.0" \
            --dump-header /tmp/governance-human-headers.txt \
            "http://127.0.0.1:8501/ai-data-governance?utm_source=x" >/dev/null
          grep -E '^HTTP/.* 302' /tmp/governance-human-headers.txt
          grep -i '^location:.*page=ai-data-governance.*utm_source=x' /tmp/governance-human-headers.txt

      - name: Verify every LinkedIn article preview and thumbnail
        run: |
          python - <<'PY'
          from io import BytesIO
          from urllib.request import Request, urlopen
          from PIL import Image
          from thinking_articles import ARTICLES

          base = 'http://127.0.0.1:8501'
          linkedin_ua = 'LinkedInBot/1.0 (compatible; Mozilla/5.0; Apache-HttpClient +http://www.linkedin.com)'

          for article in ARTICLES:
              with urlopen(Request(f'{base}/social/{article.slug}.png', headers={'User-Agent': linkedin_ua}), timeout=10) as response:
                  image_bytes = response.read()
                  assert response.headers.get_content_type() == 'image/png', response.headers
              with Image.open(BytesIO(image_bytes)) as image:
                  assert image.format == 'PNG'
                  assert image.size == (1200, 627), image.size

              req = Request(f'{base}/thinking/{article.slug}', headers={'User-Agent': linkedin_ua})
              with urlopen(req, timeout=10) as response:
                  share_html = response.read().decode('utf-8')
                  assert response.status == 200
                  assert response.headers.get_content_type() == 'text/html', response.headers
              assert 'property="og:type" content="article"' in share_html
              assert 'property="og:image:width" content="1200"' in share_html
              assert 'property="og:image:height" content="627"' in share_html
              assert 'rel="image_src"' in share_html
              assert 'name="twitter:card" content="summary_large_image"' in share_html
              assert 'type="application/ld+json"' in share_html
              assert 'window.location.replace' not in share_html
              assert article.title in share_html
              assert f'/social/{article.slug}.png' in share_html
              print(f'Validated LinkedIn preview route: {article.slug}')
          PY

      - name: Verify human friendly article route redirects to full article
        run: |
          SLUG="when-an-ai-use-case-should-be-stopped"
          curl --silent --show-error --head \
            --user-agent "Mozilla/5.0" \
            --dump-header /tmp/human-article-headers.txt \
            "http://127.0.0.1:8501/thinking/${SLUG}" >/dev/null
          grep -E '^HTTP/.* 302' /tmp/human-article-headers.txt
          grep -i '^location:.*page=thinking.*article=when-an-ai-use-case-should-be-stopped' /tmp/human-article-headers.txt

      - name: Verify robots and sitemap
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8501/robots.txt | grep 'Sitemap:'
          curl --fail --silent --show-error http://127.0.0.1:8501/robots.txt | grep 'LinkedInBot'
          curl --fail --silent --show-error http://127.0.0.1:8501/sitemap.xml > /tmp/sitemap.xml
          grep '<urlset' /tmp/sitemap.xml
          grep '/thinking/when-an-ai-use-case-should-be-stopped' /tmp/sitemap.xml

      - name: Show Streamlit log on failure
        if: failure()
        run: cat /tmp/streamlit.log || true
