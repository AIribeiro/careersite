name: Market Signals — one-time approved video media import

on:
  push:
    paths:
      - ".github/workflows/market-signals-once-media-import.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Move exact owner-approved media to immutable public storage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 1 --max-time 230 \
            "https://rnqweoxtynelfirffmlr.supabase.co/functions/v1/market-signals-media-once-20261121?token=ad59add9c5620e2e67f4f896a5c8a0ba0b9a8166530a3bdb" \
            -o /tmp/market-media-release.json
          cat /tmp/market-media-release.json
          python - <<'PY'
          import json
          result=json.load(open('/tmp/market-media-release.json'))
          assert result['status']=='exact_approved_media_published',result
          sources={a['kind']:a for a in result['assets']}
          assert sources['video']['sha256']=='eafa2f511a328d4dc2ed45f10d2349598b822e7f1db166dce66651a62ffa326f'
          assert sources['video']['bytes']==9984008
          assert sources['poster']['sha256']=='7fdbd6cedc8aa013abadbb89a18c629e93d17df98e448cc166590b44599f2ce3'
          assert sources['poster']['bytes']==105462
          print('APPROVED MASTER SHA256 / BYTE LENGTH / PUBLIC READBACK: PASS')
          PY
      - name: Verify anonymous HEAD and ranged delivery for full MP4
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="https://rnqweoxtynelfirffmlr.supabase.co/storage/v1/object/public/portfolio-public-videos/market-signals/unionen-2026-11/website-eafa2f511a32.mp4"
          POSTER="https://rnqweoxtynelfirffmlr.supabase.co/storage/v1/object/public/careersite-article-images/market-signals/unionen-2026-11/poster-7fdbd6cedc8a.jpg"
          curl --fail-with-body --silent --show-error --max-time 35 -D /tmp/videohead.txt -o /dev/null -I "$VIDEO"
          curl --fail-with-body --silent --show-error --max-time 35 -D /tmp/posterhead.txt -o /dev/null -I "$POSTER"
          curl --fail-with-body --silent --show-error --max-time 35 -D /tmp/rangestart.txt -H 'Range: bytes=0-1023' -o /tmp/range-start.bin "$VIDEO"
          curl --fail-with-body --silent --show-error --max-time 35 -D /tmp/rangemid.txt -H 'Range: bytes=4900000-4901023' -o /tmp/range-mid.bin "$VIDEO"
          curl --fail-with-body --silent --show-error --max-time 35 -D /tmp/rangeend.txt -H 'Range: bytes=9982984-9984007' -o /tmp/range-end.bin "$VIDEO"
          python - <<'PY'
          import re,pathlib
          def headers(p):
              raw=pathlib.Path(p).read_text()
              return raw.lower().replace('\r','')
          h=headers('/tmp/videohead.txt')
          ph=headers('/tmp/posterhead.txt')
          assert '200' in h.splitlines()[0],h
          assert 'content-type: video/mp4' in h,h
          assert '200' in ph.splitlines()[0],ph
          assert 'content-type: image/jpeg' in ph,ph
          for name,part,length in [
              ('start','bytes 0-1023/9984008',1024),
              ('mid','bytes 4900000-4901023/9984008',1024),
              ('end','bytes 9982984-9984007/9984008',1024)]:
              hh=headers('/tmp/range'+name+'.txt')
              assert '206' in hh.splitlines()[0],(name,hh)
              assert 'content-range: '+part in hh,(name,hh)
              assert pathlib.Path('/tmp/range-'+name+'.bin').stat().st_size==length,name
          beginning=pathlib.Path('/tmp/range-start.bin').read_bytes()
          assert beginning[4:8]==b'ftyp',beginning[:16]
          print('ANONYMOUS VIDEO 200, POSTER 200, THREE 206 RANGES, MP4 SIGNATURE: PASS')
          PY
