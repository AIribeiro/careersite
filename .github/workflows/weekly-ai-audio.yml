name: Weekly AI audio

on:
  push:
    branches: [main]
    paths:
      - 'src/weekly_ai_audio.py'
      - 'scripts/generate_weekly_ai_audio.py'
      - 'data/weekly_ai_audio_scripts/**'
      - 'data/weekly_ai_audio_release_trigger.txt'
      - 'scripts/normalize_weekly_ai_audio.py'
      - '.github/workflows/weekly-ai-audio.yml'
  schedule:
    # Friday after editorial release; retry Saturday if the script/CMS was late.
    # UTC scheduling follows DST-safe pushes; this is a fallback, not the main trigger.
    - cron: '25 19 * * 5,6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-ai-audio-production
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthesis dependencies
        run: python -m pip install --disable-pip-version-check edge-tts google-auth requests imageio-ffmpeg
      - name: Generate missing weekly recordings
        env:
          SUPABASE_URL: https://rnqweoxtynelfirffmlr.supabase.co
          # Publishable public read key, not a service role secret.
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_Hd24EkrnXK4kxb_VJ1KH-w_SN77LYkI
          GOOGLE_TTS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_TTS_SERVICE_ACCOUNT_JSON }}
          GOOGLE_TTS_VOICE: en-US-Neural2-D
          EDGE_TTS_VOICE: en-US-AndrewNeural
        run: |
          python scripts/generate_weekly_ai_audio.py
          python - <<'PY'
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from urllib import request, parse
          import json, os
          today = datetime.now(ZoneInfo('Europe/Stockholm')).date()
          # Validate the latest Friday issue, not a legacy Monday publication.
          friday = today - timedelta(days=(today.weekday() - 4) % 7)
          slug = 'weekly-ai-' + friday.isoformat()
          query = parse.urlencode({'select':'slug,status','slug':'eq.'+slug,'status':'eq.published'})
          req = request.Request(os.environ['SUPABASE_URL']+'/rest/v1/careersite_articles?'+query,headers={'apikey':os.environ['SUPABASE_PUBLISHABLE_KEY']})
          rows = json.load(request.urlopen(req,timeout=30))
          if rows and not (Path('static/weekly-ai')/(slug+'.mp3')).is_file():
              raise SystemExit('Published current-week edition lacks generated MP3: '+slug)
          if rows and not (Path('static/weekly-ai')/(slug+'.txt')).is_file():
              raise SystemExit('Published current-week edition lacks transcript: '+slug)
          PY
      - name: Normalize MPEG audio for Safari and other mobile browsers
        run: |
          python scripts/normalize_weekly_ai_audio.py
      - name: Commit validated recordings and transcripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d static/weekly-ai ]; then
            git add -- static/weekly-ai/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish WEEKLY AI MP3 audio editions"
            # Editorial and short-link commits may land during synthesis.
            # Rebase only the generated audio commit; never force-push or rewrite archives.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Audio publication committed on attempt $attempt"
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::Audio generated but GitHub push repeatedly conflicted"
                exit 1
              fi
              sleep $((attempt * 3))
            done
          else
            echo "No new audio editions to commit"
          fi
