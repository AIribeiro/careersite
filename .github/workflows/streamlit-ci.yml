name: Streamlit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application
        run: python -m py_compile app.py site_*.py page_*.py

      - name: Validate canonical CV binary and direct download URI
        run: |
          python - <<'PY'
          from pathlib import Path

          import site_cv
          from site_assets import CV_BYTES, CV_URI

          filename = 'Jair_Ribeiro_Senior_AI_Data_Leader_CV_2026.pdf'
          target = Path('static') / filename
          data = target.read_bytes()
          if not data.startswith(b'%PDF') or len(data) < 4000:
              raise SystemExit('Canonical repository CV is invalid')
          if not CV_BYTES.startswith(b'%PDF') or len(CV_BYTES) < 4000:
              raise SystemExit('Runtime CV bytes are invalid')
          if data != CV_BYTES:
              raise SystemExit('Static CV does not match canonical runtime PDF')

          expected_uri = f'/app/static/{filename}'
          if CV_URI != expected_uri:
              raise SystemExit(f'CV URI is not the expected same-origin static endpoint: {CV_URI!r}')
          print(f'Validated clickable static CV download ({len(data)} bytes) at {CV_URI}')
          PY

      - name: Start Streamlit
        run: |
          streamlit run app.py \
            --server.headless true \
            --server.port 8501 \
            > /tmp/streamlit.log 2>&1 &
          echo $! > /tmp/streamlit.pid

      - name: Health check
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "Streamlit health check passed"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/streamlit.log
          exit 1

      - name: Validate page image assets
        run: |
          python - <<'PY'
          import site_media
          from site_assets import HERO_URI, WORKSHOP_URI, PANEL_DIALOGUE_URI, THINKING_PANEL_URI, ABOUT_BW_URI

          assets = {
              'home': HERO_URI,
              'impact': WORKSHOP_URI,
              'panel': PANEL_DIALOGUE_URI,
              'thinking': THINKING_PANEL_URI,
              'about': ABOUT_BW_URI,
          }
          for name, uri in assets.items():
              if not uri.startswith('data:image/'):
                  raise SystemExit(f'{name} image is missing or not embedded correctly')
              if len(uri) < 10000:
                  raise SystemExit(f'{name} image payload is unexpectedly small')
              print(f'{name}: embedded image OK')
          PY

      - name: Show Streamlit log on failure
        if: failure()
        run: cat /tmp/streamlit.log || true
