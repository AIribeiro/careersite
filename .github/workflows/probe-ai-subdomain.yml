name: Probe ai.jairribeiro.com redirect and AI discovery

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/probe-ai-subdomain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect DNS and HTTP redirect chain
        run: |
          python - <<'PY'
          import json, socket, ssl
          import urllib.request
          from urllib.error import HTTPError, URLError

          urls = [
              "https://ai.jairribeiro.com/llms.txt",
              "https://ai.jairribeiro.com/agents.md",
              "https://ai.jairribeiro.com/agent/catalog.json",
              "https://jairribeiro-ai.streamlit.app/llms.txt",
              "https://airibeiro.github.io/careersite/llms.txt",
          ]
          class NoFollow(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          nofollow = urllib.request.build_opener(NoFollow())
          follow = urllib.request.build_opener()
          for hostname in ["ai.jairribeiro.com", "jairribeiro-ai.streamlit.app", "airibeiro.github.io"]:
              try:
                  print("DNS", hostname, sorted({x[4][0] for x in socket.getaddrinfo(hostname, 443, type=socket.SOCK_STREAM)}))
              except Exception as exc:
                  print("DNS_ERROR", hostname, type(exc).__name__, str(exc)[:230])
          for url in urls:
              print("\nPROBE", url)
              for label, opener in [("initial", nofollow), ("final", follow)]:
                  try:
                      req = urllib.request.Request(url, headers={
                          "User-Agent": "Mozilla/5.0 (compatible; PortfolioDiscoveryProbe/1.0)",
                          "Accept": "text/plain, text/markdown, application/json, */*",
                      })
                      try:
                          response = opener.open(req, timeout=18)
                      except HTTPError as error:
                          response = error
                      with response:
                          body = response.read(2048)
                          status = getattr(response, "status", response.code)
                          print(label, json.dumps({
                              "http": status,
                              "final_url": response.geturl(),
                              "location": response.headers.get("location", ""),
                              "content_type": response.headers.get("content-type", ""),
                              "prefix": body[:200].decode("utf-8", "replace").replace("\n", " "),
                          }, ensure_ascii=False))
                  except Exception as exc:
                      print(label + "_ERROR", type(exc).__name__, str(exc)[:300])
              print("END", url)
          PY

      - name: Evaluate redirected AI discovery readiness
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          expected = {
              "/llms.txt": ("text/plain", "https://airibeiro.github.io/careersite/llms.txt"),
              "/agents.md": ("text/markdown", "https://airibeiro.github.io/careersite/agents.md"),
              "/agent/catalog.json": ("application/json", "https://airibeiro.github.io/careersite/agent/catalog.json"),
          }
          passed = 0
          for path, (mime, target) in expected.items():
              origin = "https://ai.jairribeiro.com" + path
              try:
                  with urlopen(Request(origin, headers={"User-Agent": "PortfolioDiscoveryReadiness/1.1"}), timeout=20) as response:
                      actual_type = response.headers.get("Content-Type", "")
                      final_url = response.geturl()
                      valid = response.status == 200 and actual_type.startswith(mime) and final_url == target
                      print(("PASS" if valid else "NOT_READY"), path, "HTTP", response.status, "type", actual_type, "final", final_url)
                      passed += int(valid)
              except Exception as exc:
                  print("NOT_READY", path, type(exc).__name__, str(exc)[:240])
          print("READINESS", str(passed) + "/" + str(len(expected)), "paths return public machine-readable content via ai.jairribeiro.com")
          PY
