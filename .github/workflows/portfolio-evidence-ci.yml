name: Portfolio evidence and CV quality

on:
  push:
    paths:
      - "src/page_home.py"
      - "src/page_impact.py"
      - "src/page_ai_data_governance.py"
      - "src/home_pathways.py"
      - "src/portfolio_operating_evidence.py"
      - "src/site_cv.py"
      - "src/site_meta.py"
      - "tests/test_home_grid_layout.py"
      - "tests/test_home_case_order.py"
      - "tests/test_impact_case_consistency.py"
      - "tests/test_public_copy_guard.py"
      - "tests/test_career_consistency.py"
      - ".github/workflows/portfolio-evidence-ci.yml"
  pull_request:
    paths:
      - "src/page_home.py"
      - "src/page_impact.py"
      - "src/page_ai_data_governance.py"
      - "src/home_pathways.py"
      - "src/portfolio_operating_evidence.py"
      - "src/site_cv.py"
      - "src/site_meta.py"
      - "tests/test_home_grid_layout.py"
      - "tests/test_home_case_order.py"
      - "tests/test_impact_case_consistency.py"
      - "tests/test_public_copy_guard.py"
      - "tests/test_career_consistency.py"
      - ".github/workflows/portfolio-evidence-ci.yml"

permissions:
  contents: read

jobs:
  focused-review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Compile affected modules
        run: python -m compileall -q src/page_home.py src/page_impact.py src/page_ai_data_governance.py src/portfolio_operating_evidence.py src/site_cv.py src/site_meta.py
      - name: Test evidence, CV and public-copy contracts
        run: |
          for name in home_grid_layout home_case_order impact_case_consistency public_copy_guard career_consistency msx_dates home_pathways core_portfolio_navigation governance_feature; do
            python -m unittest discover -s tests -p "test_${name}.py" -v
          done
      - name: Confirm generated CV still fits two pages
        run: |
          python - <<'PY'
          from io import BytesIO
          from pypdf import PdfReader
          from site_cv import build_public_cv
          data = build_public_cv()
          pages = PdfReader(BytesIO(data), strict=True).pages
          assert len(pages) == 2, f"CV unexpectedly expanded to {len(pages)} pages"
          text = " ".join((page.extract_text() or "") for page in pages)
          assert "Customer Interview Analyzer" in text
          assert "did not scale it" in text
          print("CV verified: two pages, working prototype and bounded outcome")
          PY
