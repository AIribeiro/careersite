name: Advisory Requests UX regression

on:
  pull_request:
    branches: [main]
    paths:
      - "src/page_advisory_member_experience.py"
      - "src/page_advisory_conversation_workspace.py"
      - "src/page_advisory_client_journey.py"
      - "src/page_rollout_workspace_ui.py"
      - "tests/test_advisory_requests_experience.py"
      - ".github/workflows/advisory-requests-ux.yml"
  push:
    branches: [main]
    paths:
      - "src/page_advisory_member_experience.py"
      - "src/page_advisory_conversation_workspace.py"
      - "src/page_advisory_client_journey.py"
      - "src/page_rollout_workspace_ui.py"
      - "tests/test_advisory_requests_experience.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisory-requests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application requirements
        run: python -m pip install -r requirements.txt
      - name: Compile and test private request workspace
        run: |
          python -m py_compile src/page_advisory_member_experience.py src/page_advisory_conversation_workspace.py
          python -m unittest tests.test_advisory_requests_experience tests.test_advisory_engagement_journey -v
