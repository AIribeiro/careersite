name: Publish Policy Is Not Permission briefing artwork
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_policy_is_not_permission_infographic.py'
      - '.github/workflows/policy-is-not-permission-artwork.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: policy-is-not-permission-artwork-main
  cancel-in-progress: true
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install approved artwork tooling
        run: python -m pip install -r requirements.txt 'reportlab==4.4.4'
      - name: Render original source-matched desktop, mobile and A4 artwork
        run: python scripts/build_policy_is_not_permission_infographic.py --output /tmp/authority-path
      - name: Package reviewed release under the shared Safari-safe contract
        run: |
          rm -rf static/briefing-artwork/policy-is-not-permission-executive-ai-governance
          python scripts/build_briefing_artwork_bundle.py \
              --slug policy-is-not-permission-executive-ai-governance \
              --article-fingerprint a7d12810bcd11e86269b903dc510ca337b4268f02f95ef80f565b9103bb47395 \
              --revision 2026-11-07-r2 \
              --desktop /tmp/authority-path/desktop.png \
              --mobile /tmp/authority-path/mobile.png \
              --pdf /tmp/authority-path/infographic.pdf \
              --heading "Policy is not permission" \
              --deck "Six operating proofs, proportionate autonomy and an enforceable action-time decision."
      - name: Verify actual decoded images, A4 PDF and generic reader
        run: |
          PYTHONPATH=src python -m unittest -v tests.test_briefing_approved_asset_renderer
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from PIL import Image
          from pypdf import PdfReader
          from src.briefing_approved_asset_renderer import load_bundle,validate_bundle
          root=Path('static/briefing-artwork')
          b=load_bundle('policy-is-not-permission-executive-ai-governance',asset_root=root)
          assert b and b['article_fingerprint']=='a7d12810bcd11e86269b903dc510ca337b4268f02f95ef80f565b9103bb47395'
          desktop,mobile,pdf=validate_bundle(b)
          for kind,raw in [('desktop',desktop),('mobile',mobile)]:
              path=root/b['slug']/b[kind]['file']
              assert hashlib.sha256(raw).hexdigest()==b[kind]['sha256']
              with Image.open(path) as im:
                  assert im.width >= 650 and im.height >= 1250
                  im.verify()
          path=root/b['slug']/b['pdf']['file']
          with path.open('rb') as f:
              reader=PdfReader(f,strict=True)
              assert len(reader.pages)==1
              page=reader.pages[0]
              assert 589<float(page.mediabox.width)<601
              assert 836<float(page.mediabox.height)<848
          print('Article fingerprint, desktop/mobile WebPs, A4 PDF: verified')
          PY
      - name: Commit release bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/briefing-artwork/policy-is-not-permission-executive-ai-governance/
          if ! git diff --cached --quiet; then
            git commit -m "Release Policy Is Not Permission executive infographic, mobile art and A4 PDF"
            for attempt in 1 2 3 4; do
              git pull --rebase origin main || exit 1
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
