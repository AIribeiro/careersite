name: Publish portfolio release feed

# Every main-branch change is checked; only deployment-relevant files are
# recorded. The feed's own bot commit is ignored by the detector.
on:
  push:
    branches: [main]

concurrency:
  group: portfolio-release-feed-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture changed public pages, assets and credentials
        run: |
          python scripts/sync_portfolio_releases.py "${{ github.event.before }}" "${{ github.sha }}"
      - name: Publish latest portfolio change when the feed changes
        run: |
          if ! git diff --quiet -- data/portfolio_release_feed.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/portfolio_release_feed.json
            git commit -m "Refresh What's New after portfolio deployment"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
