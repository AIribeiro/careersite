name: AI investment article replacement release QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-investment-article-release-qa-20261123.yml'
      - 'main.py'
permissions:
  contents: write
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies and browser
        run: |
          python -m pip install --quiet 'playwright==1.58.0'
      - name: Run article reader and premium preview regression tests
        if: false
        run: |
          set +e
          PYTHONPATH=src python -m unittest discover -s tests -p test_article_reader_video.py -v > /tmp/invest-video-unittest.txt 2>&1
          video=$?
          PYTHONPATH=src python -m unittest discover -s tests -p test_article_early_access.py -v > /tmp/invest-early-unittest.txt 2>&1
          access=$?
          echo "VIDEO_SUITE_EXIT=$video" >> "$GITHUB_ENV"
          echo "ACCESS_SUITE_EXIT=$access" >> "$GITHUB_ENV"
          cat /tmp/invest-video-unittest.txt
          cat /tmp/invest-early-unittest.txt
          exit 0
      - name: Check live article preview in Chromium and exact source bindings
        run: |
          python - <<'PY'
          import json,time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          slug="enterprise-ai-explained-beyond-models-and-agents"
          title="What Should Enterprise AI Prove Before the Next Investment?"
          base="https://jairribeiro.com/?page=thinking&article="+slug
          direct="https://jairribeiro-ai.streamlit.app/?page=thinking&article="+slug
          outcome={"unit_tests":{"article_video_suite_exit":__import__('os').environ.get('VIDEO_SUITE_EXIT','unavailable'),"early_access_suite_exit":__import__('os').environ.get('ACCESS_SUITE_EXIT','unavailable')},"browser":[]}
          with sync_playwright() as p:
            browser=p.chromium.launch(channel="chrome",headless=True,args=["--autoplay-policy=no-user-gesture-required"])
            for name,url,width in [("streamlit-desktop",direct,1440),("streamlit-mobile",direct,390),("branded-desktop",base,1440)]:
              page=browser.new_page(viewport={"width":width,"height":900},ignore_https_errors=True)
              result={"name":name,"url":url}
              try:
                response=page.goto(url,wait_until="domcontentloaded",timeout=60000)
                page.wait_for_timeout(16000)
                result["http_status"]=response.status if response else None
                result["frames"]=[]
                for f in page.frames:
                  try:
                    content=f.locator("body").inner_text(timeout=2200)
                    result["frames"].append({
                     "url":f.url[:140],
                     "title_seen":title in content,
                     "body_excerpt":content[:1250],
                     "body_length":len(content),
                     "cover_css_in_markup":'article-early-cover' in f.content(),
                     "video_css_in_markup":'article-video-feature' in f.content(),
                     "title_content":content.find(title),
                     "header_count":f.locator('img[src*="header-dc279160fb11"]').count(),
                     "header_loaded":f.evaluate('''() => Array.from(document.querySelectorAll('img[src*="header-dc279160fb11"]')).some(x=>x.complete&&x.naturalWidth>0)'''),
                     "new_video_count":f.locator('video source[src*="web-d15b86c15f32"]').count(),
                     "old_video_count":f.locator('video source[src*="web-5c54338a7210"]').count(),
                     "premium_registration_seen":"Free registration" in content or "Premium Reader" in content,
                     "full_body_marker_seen":"The commercial operations pilot may have produced accurate summaries" in content,
                     "video_ancestor_visible":f.locator('video').count()>0 and f.locator('video').first.is_visible(),
                     "video_src":f.locator('video source').first.get_attribute("src") if f.locator('video source').count() else None
                    })
                  except Exception as exc:
                    result["frames"].append({"url":f.url[:140],"error":str(exc)[:250]})
              except Exception as exc: result["error"]=str(exc)[:300]
              outcome["browser"].append(result)
              print(json.dumps(result,indent=2),flush=True)
              page.close()
            browser.close()
          dest=Path("docs/ai-investment-article-live-release-qa-20261123.json")
          dest.write_text(json.dumps(outcome,indent=2)+"\n",encoding="utf8")
          PY
      - name: Record observed acceptance evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ ! -f docs/ai-investment-article-live-release-qa-20261123.json ]; then
            printf '{"error":"browser report unavailable","unit_video_exit":"%s","unit_access_exit":"%s"}\n' "${VIDEO_SUITE_EXIT:-unavailable}" "${ACCESS_SUITE_EXIT:-unavailable}" > docs/ai-investment-article-live-release-qa-20261123.json
          fi
          git add docs/ai-investment-article-live-release-qa-20261123.json
          if ! git diff --cached --quiet; then
            git commit -m "Record observed AI investment article release QA [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
