name: Generalized MTO regression tests
on:
  push:
    branches: [main]
    paths:
      - "src/meeting_to_offer.py"
      - "src/hiring_opportunity_comparison.py"
      - "src/page_hiring_prediction_v2.py"
      - "tests/test_meeting_to_offer.py"
      - "tests/test_hiring_opportunity_comparison.py"
      - ".github/workflows/mto-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/meeting_to_offer.py"
      - "src/hiring_opportunity_comparison.py"
      - "src/page_hiring_prediction_v2.py"
      - "tests/test_meeting_to_offer.py"
      - "tests/test_hiring_opportunity_comparison.py"
      - ".github/workflows/mto-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python compile
        run: python -m compileall -q src/meeting_to_offer.py src/hiring_opportunity_comparison.py tests/test_meeting_to_offer.py tests/test_hiring_opportunity_comparison.py
      - name: MTO estimator and portfolio comparison tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests/test_meeting_to_offer.py tests/test_hiring_opportunity_comparison.py -v
