name: Release AI workforce readiness briefing artwork
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_ai_workforce_readiness.py'
      - '.github/workflows/ai-workforce-readiness-artwork.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-locked-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install audited image and PDF dependencies
        run: python -m pip install -r requirements.txt 'reportlab==4.4.4'
      - name: Generate distinct desktop, mobile and A4 source art
        run: python scripts/generate_ai_workforce_readiness.py --output /tmp/ai-workforce
      - name: Build immutable source-matched release bundle
        run: |
          python scripts/build_briefing_artwork_bundle.py \
            --slug ai-workforce-readiness-is-a-release-decision \
            --article-fingerprint 8dafee62bd122915c9f6a80a687b0baeb330012b0038e5152c48b0f4d96a5f3a \
            --revision 2026-11-06-r1 \
            --desktop /tmp/ai-workforce/desktop.png \
            --mobile /tmp/ai-workforce/mobile.png \
            --pdf /tmp/ai-workforce/infographic.pdf \
            --heading "AI access is not workforce readiness" \
            --deck "Six commitments turn technology spending into a business-led capability release decision."
      - name: Test image signatures, hashes, PDF and shared embedded renderer
        run: |
          PYTHONPATH=src python -m unittest -v tests.test_briefing_approved_asset_renderer
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json,hashlib
          p=Path('static/briefing-artwork/ai-workforce-readiness-is-a-release-decision')
          j=json.loads((p/'manifest.json').read_text())
          assert j['article_fingerprint']=='8dafee62bd122915c9f6a80a687b0baeb330012b0038e5152c48b0f4d96a5f3a'
          for k in ('desktop','mobile'):
              path=p/j[k]['file']
              data=path.read_bytes()
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
              assert hashlib.sha256(data).hexdigest()==j[k]['sha256']
              with Image.open(path) as im:
                  assert im.size==(j[k]['width'],j[k]['height'])
                  im.verify()
          pdf=(p/j['pdf']['file']).read_bytes()
          assert pdf.startswith(b'%PDF-') and b'%%EOF' in pdf[-2048:]
          print('Artwork release assets are source-locked and decodable')
          PY
      - name: Commit validated infographic, mobile asset and A4 PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/briefing-artwork/ai-workforce-readiness-is-a-release-decision/
          if ! git diff --cached --quiet; then
            git commit -m "Publish validated workforce readiness visual bundle"
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
