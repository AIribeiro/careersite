name: AI & Data Market Signals checks
on:
  pull_request:
    paths:
      - 'src/page_advisory_market_signals.py'
      - 'src/market_labelled_bars.py'
      - 'src/page_advisory_market_observatory.py'
      - 'src/page_owner_market_signals.py'
      - 'src/page_owner_advisory_management.py'
      - 'src/page_advisory_market_review.py'
      - 'src/advisory_service_visibility.py'
      - 'src/page_advisory_portal.py'
      - 'src/page_advisory_member_experience.py'
      - 'src/page_public_services.py'
      - 'src/page_reader_native.py'
      - 'src/site_reader_navigation.py'
      - 'main.py'
      - 'tests/test_market_signals.py'
      - 'tests/test_market_chart_labels.py'
      - 'tests/test_market_observatory.py'
      - 'tests/test_market_signals_management.py'
      - '.github/workflows/market-signals-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-and-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact portfolio dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile new and modified service routes
        run: |
          python -m py_compile main.py \
            src/page_advisory_market_signals.py \
            src/market_labelled_bars.py \
            src/page_advisory_market_observatory.py \
            src/page_owner_market_signals.py \
            src/page_owner_advisory_management.py \
            src/page_advisory_market_review.py \
            src/advisory_service_visibility.py \
            src/page_advisory_portal.py \
            src/page_advisory_member_experience.py \
            src/page_public_services.py \
            src/page_reader_native.py \
            src/site_reader_navigation.py \
            tests/test_market_signals.py \
            tests/test_market_chart_labels.py \
            tests/test_market_observatory.py \
            tests/test_market_signals_management.py
      - name: Verify evidence integrity and PDF export
        run: python -m unittest discover -s tests -p 'test_market_signals.py' -v
      - name: Verify full-length mobile chart labels and sanitisation
        run: python -m unittest discover -s tests -p 'test_market_chart_labels.py' -v
      - name: Verify market observatory and public-data isolation
        run: python -m unittest discover -s tests -p 'test_market_observatory.py' -v
      - name: Verify owner operations and publication-control boundaries
        run: python -m unittest discover -s tests -p 'test_market_signals_management.py' -v
