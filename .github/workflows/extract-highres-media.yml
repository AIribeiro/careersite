name: Extract high-resolution media

on:
  push:
    paths:
      - '.github/workflows/extract-highres-media.yml'
      - 'payload_parts/**'
      - 'asset_parts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install pillow
      - name: Recover and inventory source photography
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, io, zipfile, re

          root = Path('.')
          out = root / 'images'
          out.mkdir(exist_ok=True)
          candidates = {}

          # The text-safe payload is the valid legacy source bundle. Recover image assets only;
          # application code from the payload is never executed.
          parts = sorted((root / 'payload_parts').glob('part_*.b64'))
          if parts:
              encoded = ''.join(p.read_text(encoding='ascii') for p in parts)
              with zipfile.ZipFile(io.BytesIO(base64.b64decode(encoded))) as z:
                  for name in z.namelist():
                      if name.startswith('assets/') and not name.endswith('/'):
                          candidates[Path(name).name] = z.read(name)

          # The dedicated speaking image is also stored as text-safe base64 source.
          panel_parts = sorted((root / 'asset_parts').glob('panel.webp.part*.b64'))
          if panel_parts:
              try:
                  candidates['panel.webp'] = base64.b64decode(''.join(p.read_text(encoding='ascii') for p in panel_parts))
              except Exception as exc:
                  print('Panel source could not be decoded:', exc)

          print('Source image inventory:')
          qualifying = []
          for name, blob in candidates.items():
              try:
                  im = Image.open(io.BytesIO(blob))
                  width, height = im.size
                  print(f'  {name}: {width}x{height}, {len(blob)} bytes, {im.format}')
                  # High-resolution policy: enough source pixels for a large desktop/retina slot.
                  if max(width, height) >= 1200 and width * height >= 1_000_000:
                      qualifying.append((name, blob, im.format, width, height))
              except Exception as exc:
                  print(f'  {name}: skipped ({exc})')

          print('Qualifying high-resolution assets:')
          written = []
          for name, blob, fmt, width, height in qualifying:
              ext = (fmt or Path(name).suffix.lstrip('.') or 'jpg').lower()
              ext = {'jpeg':'jpg'}.get(ext, ext)
              stem = re.sub(r'[^a-z0-9]+', '-', Path(name).stem.lower()).strip('-') or 'photo'
              dest = out / f'{stem}.{ext}'
              dest.write_bytes(blob)
              written.append((dest.name, width, height, len(blob)))
              print(' ', written[-1])

          if not written:
              raise SystemExit('No source image meets the high-resolution policy')
          PY
      - name: Commit recovered image files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images
          if git diff --cached --quiet; then
            echo 'No media changes to commit'
          else
            git commit -m 'Add high-resolution source photography'
            git push origin main
          fi
