name: Streamlit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application
        run: python -m py_compile app.py site_*.py page_*.py

      - name: Validate generated CV
        run: |
          python - <<'PY'
          import site_cv_patch
          from site_assets import CV_BYTES, CV_URI
          from pathlib import Path

          if not CV_BYTES.startswith(b'%PDF'):
              raise SystemExit('Generated CV is not a PDF')
          if len(CV_BYTES) < 1000:
              raise SystemExit('Generated CV is unexpectedly small')
          if not CV_URI.startswith('/app/static/'):
              raise SystemExit(f'CV URI is not a static URL: {CV_URI}')
          target = Path('static') / Path(CV_URI).name
          if not target.exists() or not target.read_bytes().startswith(b'%PDF'):
              raise SystemExit('Static CV file was not created correctly')
          print(f'Validated generated CV ({len(CV_BYTES)} bytes) at {CV_URI}')
          PY

      - name: Start Streamlit
        run: |
          streamlit run app.py \
            --server.headless true \
            --server.port 8501 \
            > /tmp/streamlit.log 2>&1 &
          echo $! > /tmp/streamlit.pid

      - name: Health check
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "Streamlit health check passed"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/streamlit.log
          exit 1

      - name: Validate downloadable CV route
        run: |
          curl --fail --silent http://127.0.0.1:8501/app/static/Jair_Ribeiro_Senior_AI_Data_Leader_CV_2026.pdf -o /tmp/cv.pdf
          test "$(head -c 4 /tmp/cv.pdf)" = "%PDF"
          echo "Downloadable CV route passed"

      - name: Show Streamlit log on failure
        if: failure()
        run: cat /tmp/streamlit.log || true
