name: OpenAI Badge Asset

on:
  push:
    paths:
      - ".github/workflows/openai-badge-asset.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official OpenAI Academy AI Leadership artwork
        run: |
          set -euo pipefail
          mkdir -p images/credentials
          curl --fail --location --retry 3 \
            "https://cdn.gradual.com/images/https%3A//d2xo500swnpgl1.cloudfront.net/uploads/oaiacademy/Leadership-600x600-8500de53-af00-467a-9b8c-fbc2cee20f67-1788879140339.jpeg?fit=scale-down&width=1000" \
            -o images/credentials/openai_ai_leadership.jpg
          file images/credentials/openai_ai_leadership.jpg
          test -s images/credentials/openai_ai_leadership.jpg
      - name: Commit artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/credentials/openai_ai_leadership.jpg
          if git diff --cached --quiet; then
            echo "Artwork already current."
          else
            git commit -m "Add official OpenAI Academy AI Leadership artwork"
            git push
          fi
